[workspace]
resolver = "2"
exclude = ["servers"]
members = ["apps/delidev/src-tauri", "apps/delitools/src-tauri", "crates/perfine-core"]

[patch.crates-io]
# Match the upstream CEF/winit patch so menus and runtime windows share one dpi type.
# Cargo.lock pins the reviewed upstream winit revision; remove after upstream convergence.
dpi = { git = "https://github.com/tauri-apps/winit-gtk4", branch = "master" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975" }
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "c8c75b1f7f43e7cb1e7d773ed2f6f96fad2fe975" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"
long_running_const_eval = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# The task scheduling workflow is a single-threaded async task, so Send bounds are unnecessary.
future_not_send = "allow"
