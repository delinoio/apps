}

message RequestDeviceSyncRequest {
  string device_id = 1;
}
message RequestDeviceSyncResponse {
  google.protobuf.Timestamp next_allowed_at = 1;
}

// ---------------------------------------------------------------------------
// CollectorService: device-token operations of a running collector
// ---------------------------------------------------------------------------

// Every CollectorService method requires a device access token.
service CollectorService {
  // Sent every minute. Extends every valid lease that the device holds.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Versioned cumulative 15-minute buckets, at most 1 MiB per request.
  rpc UploadUsage(UploadUsageRequest) returns (UploadUsageResponse);
  rpc ReportParserStatus(ReportParserStatusRequest) returns (ReportParserStatusResponse);
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  // Accepted only under the current valid lease epoch.
  rpc ReportSnapshot(ReportSnapshotRequest) returns (ReportSnapshotResponse);
}

message HeartbeatRequest {
  string collector_version = 1;
  string os_version = 2;
  // Registered connections for which this device can read a usable local
  // credential now.
  repeated string ready_connection_ids = 3;
}
message ConnectionAssignment {
  string connection_id = 1;
  Provider provider = 2;
  // Current lease, or absent when no valid lease exists.
  Lease lease = 3;
  // No valid lease exists and this device is the selected candidate.
  bool acquire_recommended = 4;
  bool refresh_requested = 5;
}
message HeartbeatResponse {
  google.protobuf.Timestamp server_time = 1;
  ClientVersionStatus version_status = 2;
  repeated ConnectionAssignment assignments = 3;
  bool local_sync_requested = 4;
  google.protobuf.Duration heartbeat_interval = 5;
}

message UsageBucket {
  LocalTool tool = 1;
  // Model identifier as reported by the tool; "unknown" when absent.
  string model = 2;
  // UTC start of the 15-minute bucket.
  google.protobuf.Timestamp bucket_start = 3;
  // Positive version that increases whenever the cumulative values change.
  uint64 version = 4;
  // Sessions that start in this bucket.
  uint64 session_count = 5;
  TokenCounts tokens = 6;
}
message BucketKey {
  LocalTool tool = 1;
  string model = 2;
  google.protobuf.Timestamp bucket_start = 3;
}
message BucketResult {
  BucketKey key = 1;
  BucketOutcome outcome = 2;
  // Version stored after this request; zero for rejected buckets.
  uint64 stored_version = 3;
}
message UploadUsageRequest {
  repeated UsageBucket buckets = 1;
}
message UploadUsageResponse {
  // One result per bucket, in request order.
  repeated BucketResult results = 1;
  // Oldest bucket start the server accepts at this time.
  google.protobuf.Timestamp retention_start = 2;
}

message ReportParserStatusRequest {
  repeated ParserStatus statuses = 1;
}
message ReportParserStatusResponse {}

message AcquireLeaseRequest {
  string connection_id = 1;
}
message AcquireLeaseResponse {
  bool granted = 1;
  // The caller's new lease when granted; otherwise the current valid lease,
  // or absent.
  Lease lease = 2;
}

message RenewLeaseRequest {
  string connection_id = 1;
  uint64 epoch = 2;
}
message RenewLeaseResponse {
  Lease lease = 1;
  bool refresh_requested = 2;
}

message ReleaseLeaseRequest {
  string connection_id = 1;
  uint64 epoch = 2;
}
message ReleaseLeaseResponse {}

message ReportSnapshotRequest {
  string connection_id = 1;
  uint64 lease_epoch = 2;
  Snapshot snapshot = 3;
}
message ReportSnapshotResponse {
  SnapshotOutcome outcome = 1;
}

// ---------------------------------------------------------------------------
// ConnectionService: external connections
// ---------------------------------------------------------------------------

service ConnectionService {
  // Device token. Registers the calling device for the new connection.
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  // User or device token.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  // User or device token.
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  // User token.
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  // Device token. Registers the calling device.
  rpc RegisterConnectionDevice(RegisterConnectionDeviceRequest) returns (RegisterConnectionDeviceResponse);
  // User or device token. A device token can unregister only itself.
  rpc UnregisterConnectionDevice(UnregisterConnectionDeviceRequest) returns (UnregisterConnectionDeviceResponse);
  // User or device token. Manual refresh, once per minute per connection.
  rpc RequestConnectionRefresh(RequestConnectionRefreshRequest) returns (RequestConnectionRefreshResponse);
}

message CreateConnectionRequest {
  string request_id = 1;
  Provider provider = 2;
  string display_name = 3;
  // Non-secret provider account name for display, for example a team name.
  string account_label = 4;
  // Lowercase hex SHA-256 of "<provider enum name>:<provider account ID>",
  // or empty when the provider exposes no account identifier.
  string account_fingerprint = 5;
}
message CreateConnectionResponse {
  Connection connection = 1;
}

message ListConnectionsRequest {
  Page page = 1;
}
message ListConnectionsResponse {
  repeated Connection connections = 1;
  string next_cursor = 2;
}

message GetConnectionRequest {
  string connection_id = 1;
}
message GetConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  string connection_id = 1;
}
message DeleteConnectionResponse {
  google.protobuf.Timestamp purge_deadline = 1;
}

message RegisterConnectionDeviceRequest {
  string connection_id = 1;
  string account_fingerprint = 2;
}
message RegisterConnectionDeviceResponse {
  Connection connection = 1;
}

message UnregisterConnectionDeviceRequest {
  string connection_id = 1;
  string device_id = 2;
}
message UnregisterConnectionDeviceResponse {
  Connection connection = 1;
}

message RequestConnectionRefreshRequest {
  string connection_id = 1;
}
message RequestConnectionRefreshResponse {
  google.protobuf.Timestamp next_allowed_at = 1;
}

// ---------------------------------------------------------------------------
// DashboardService: spaces, dashboards, widgets and sharing
// ---------------------------------------------------------------------------

// Every DashboardService method requires a user token.
service DashboardService {
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  rpc ListDashboards(ListDashboardsRequest) returns (ListDashboardsResponse);
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc CreateDashboard(CreateDashboardRequest) returns (CreateDashboardResponse);
  rpc RenameDashboard(RenameDashboardRequest) returns (RenameDashboardResponse);
  rpc DeleteDashboard(DeleteDashboardRequest) returns (DeleteDashboardResponse);
  rpc AddWidget(AddWidgetRequest) returns (AddWidgetResponse);
  rpc RemoveWidget(RemoveWidgetRequest) returns (RemoveWidgetResponse);
  rpc UpdateWidgetLayout(UpdateWidgetLayoutRequest) returns (UpdateWidgetLayoutResponse);
  rpc UpdateWidgetQuery(UpdateWidgetQueryRequest) returns (UpdateWidgetQueryResponse);
  rpc SetWidgetSharingScope(SetWidgetSharingScopeRequest) returns (SetWidgetSharingScopeResponse);
  rpc RevokeWidgetSharing(RevokeWidgetSharingRequest) returns (RevokeWidgetSharingResponse);
}

message Space {
  // Delcore tenant ID.
  string id = 1;
  SpaceKind kind = 2;
  string name = 3;
  repeated SpacePermission permissions = 4;
  // DEVICE_REQUIRED or READY for the personal space; READY for team spaces.
  OnboardingState onboarding_state = 5;
}

message WidgetLayout {
  // Grid position and size on a 12-column grid.
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  string title = 5;
  WidgetPresentation presentation = 6;
}

// WidgetQuery is editable only by the widget's data owner.
message WidgetQuery {
  QueryPeriod period = 1;
  TimeGranularity granularity = 2;
  repeated LocalTool tools = 3;
  repeated string models = 4;
  repeated MetricKind metric_kinds = 5;
  repeated string resource_ids = 6;
  repeated string dimensions = 7;
  UsageBreakdownDimension breakdown = 8;
}

// WidgetSource is the data owner's sharing scope: the owner's connections
// and devices whose display data the widget can show.
message WidgetSource {
  repeated string connection_ids = 1;
  repeated string device_ids = 2;
  // Include all current and future devices of the data owner.
  bool all_devices = 3;
}

message Widget {
  string id = 1;
  WidgetType type = 2;
  WidgetLayout layout = 3;
  WidgetQuery query = 4;
  // Present only when the caller is the data owner.
  WidgetSource source = 5;
  string data_owner_user_id = 6;
  SharingState sharing_state = 7;
  SharingEndReason sharing_end_reason = 8;
  // The caller can change query, source and sharing.
  bool caller_is_data_owner = 9;
  google.protobuf.Timestamp created_at = 10;
}

message Dashboard {
  string id = 1;
  string space_id = 2;
  string name = 3;
  uint64 version = 4;
  repeated Widget widgets = 5;
  string created_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message DashboardSummary {
  string id = 1;
  string space_id = 2;
  string name = 3;
  uint64 version = 4;
  uint32 widget_count = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListSpacesRequest {
  // Logto access token for the Delcore API resource. The server uses it to
  // read the caller's current tenant memberships and never stores it.
  string delcore_access_token = 1;
}
message ListSpacesResponse {
  repeated Space spaces = 1;
}

message ListDashboardsRequest {
