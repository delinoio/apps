// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

// ErrorDetail is attached to every Connect error returned by AnyDash
// services, including the local collector service.
message ErrorDetail {
  ErrorReason reason = 1;
  string correlation_id = 2;
  // Set for RATE_LIMITED; the earliest time to retry, relative to the response.
  google.protobuf.Duration retry_after = 3;
  RateLimitScope rate_limit_scope = 4;
  // Set for QUOTA_EXCEEDED.
  QuotaInfo quota = 5;
  // Set for UPDATE_REQUIRED, with the client kind that was evaluated.
  string minimum_client_version = 6;
  ClientKind client_kind = 7;
  // Request field path for INVALID_ARGUMENT, for example "layout.width".
  string field = 8;
  // Current dashboard version for VERSION_CONFLICT.
  uint64 current_version = 9;
  // Current lease epoch for LEASE_EXPIRED, or zero when no lease exists.
  uint64 current_lease_epoch = 10;
}

message QuotaInfo {
  QuotaKind kind = 1;
  uint32 limit = 2;
  uint32 used = 3;
}

message Page {
  // Default 50, maximum 200.
  uint32 size = 1;
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 2;
}

// Money keeps the provider's original currency. amount is a decimal string
// in major units, for example "12.34". currency_code is an ISO 4217 code, or
// empty when the provider reports an amount without a currency.
message Money {
  string currency_code = 1;
  string amount = 2;
}

// TokenCounts distinguishes an absent breakdown from zero.
message TokenCounts {
  // Uncached input tokens, excluding cache reads and cache writes.
  optional uint64 input_tokens = 1;
  // Output tokens, including reasoning output tokens.
  optional uint64 output_tokens = 2;
  optional uint64 cache_read_tokens = 3;
  optional uint64 cache_write_tokens = 4;
}

message ClientVersionStatus {
  string minimum_version = 1;
  string latest_version = 2;
  bool update_available = 3;
  bool update_required = 4;
}

message MetricValue {
  MetricState state = 1;
  oneof value {
    double percent = 2;
    string decimal = 3;
    int64 integer = 4;
    Money money = 5;
    google.protobuf.Timestamp time = 6;
    google.protobuf.Duration duration = 7;
    string text = 8;
    bool flag = 9;
  }
}

message MetricObservation {
  MetricKind kind = 1;
  // Adapter-defined stable key, for example a window key or service name.
  string dimension = 2;
  MetricValue value = 3;
  // Provider unit for quantities, for example "requests"; empty otherwise.
  string unit = 4;
  MetricTemporality temporality = 5;
  // Accumulation period for CUMULATIVE values.
  google.protobuf.Timestamp period_start = 6;
  google.protobuf.Timestamp period_end = 7;
}

message ResourceObservation {
  // Provider identifier of the project, script or Pages project.
  string resource_id = 1;
  ResourceKind kind = 2;
  string display_name = 3;
  // Provider team, organization or account identifier.
  string parent_id = 4;
  ResourceHealth health = 5;
  // Provider status value as reported, for example "READY".
  string provider_status = 6;
  // VALUE when status is available; NOT_PROVIDED or FAILED otherwise.
  MetricState status_state = 7;
  repeated MetricObservation metrics = 8;
}

message Snapshot {
  google.protobuf.Timestamp observed_at = 1;
  CollectionStatus status = 2;
  FailureClass failure_class = 3;
  google.protobuf.Timestamp next_attempt_at = 4;
  repeated MetricObservation metrics = 5;
  repeated ResourceObservation resources = 6;
  // HTTP status of the failed provider response, or zero.
  uint32 provider_http_status = 7;
  ObservationSource source = 8;
}

message Lease {
  string connection_id = 1;
  string holder_device_id = 2;
  uint64 epoch = 3;
  google.protobuf.Timestamp acquired_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message ParserStatus {
  LocalTool tool = 1;
  ParserState state = 2;
  // Unreadable records in the retained source files at the latest full scan.
  uint64 skipped_record_count = 3;
  google.protobuf.Timestamp observed_at = 4;
  string parser_version = 5;
  uint32 source_path_count = 6;
}

message Device {
  string id = 1;
  string name = 2;
  DevicePlatform platform = 3;
  CpuArchitecture architecture = 4;
  CollectorKind collector_kind = 5;
  string collector_version = 6;
  string os_version = 7;
  google.protobuf.Timestamp enrolled_at = 8;
  google.protobuf.Timestamp last_heartbeat_at = 9;
  google.protobuf.Timestamp last_upload_at = 10;
  DeviceCredentialState credential_state = 11;
  bool preferred = 12;
  // Heartbeat received within the last 5 minutes.
  bool online = 13;
  repeated ParserStatus parser_statuses = 14;
}

message DeviceCredentials {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3;
  // Informational; every accepted upload extends the inactivity expiry.
  google.protobuf.Timestamp refresh_token_expires_at = 4;
}

message ConnectionDevice {
  string device_id = 1;
  string device_name = 2;
  google.protobuf.Timestamp registered_at = 3;
  // The device reported a usable local credential in its latest heartbeat.
  bool ready = 4;
  bool online = 5;
  // The device holds the current valid lease.
  bool collecting = 6;
}

message Connection {
  string id = 1;
  Provider provider = 2;
  string display_name = 3;
  string account_label = 4;
  string account_fingerprint = 5;
  google.protobuf.Timestamp created_at = 6;
  ConnectionState state = 7;
  google.protobuf.Timestamp last_success_at = 8;
  FailureClass last_failure_class = 9;
  string last_error_correlation_id = 10;
  repeated ConnectionDevice devices = 11;
  Lease lease = 12;
  google.protobuf.Timestamp next_manual_refresh_at = 13;
}

// ---------------------------------------------------------------------------
// DeviceService: enrollment, device credentials and device management
// ---------------------------------------------------------------------------

service DeviceService {
  // No bearer token. Started by a collector.
  rpc StartEnrollment(StartEnrollmentRequest) returns (StartEnrollmentResponse);
  // User token. Reads the enrollment shown on the approval page.
  rpc GetEnrollment(GetEnrollmentRequest) returns (GetEnrollmentResponse);
  // User token. Confirms the code shown by the collector.
  rpc ApproveEnrollment(ApproveEnrollmentRequest) returns (ApproveEnrollmentResponse);
  // User token.
  rpc RejectEnrollment(RejectEnrollmentRequest) returns (RejectEnrollmentResponse);
  // No bearer token. Authenticated by the enrollment device code.
  rpc PollEnrollment(PollEnrollmentRequest) returns (PollEnrollmentResponse);
  // No bearer token. Authenticated by the refresh token.
  rpc RefreshDeviceToken(RefreshDeviceTokenRequest) returns (RefreshDeviceTokenResponse);
  // Refresh token (collector logout) or user token (any device of the user).
  rpc RevokeDeviceCredentials(RevokeDeviceCredentialsRequest) returns (RevokeDeviceCredentialsResponse);
  // User token.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // User token.
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  // User token.
  rpc SetPreferredDevice(SetPreferredDeviceRequest) returns (SetPreferredDeviceResponse);
  // User token. Manual local usage refresh, once per minute per device.
  rpc RequestDeviceSync(RequestDeviceSyncRequest) returns (RequestDeviceSyncResponse);
}

message StartEnrollmentRequest {
  string device_name = 1;
  DevicePlatform platform = 2;
  CpuArchitecture architecture = 3;
  CollectorKind collector_kind = 4;
  string collector_version = 5;
  string os_version = 6;
  // Device ID kept locally after logout; empty for a new installation.
  string previous_device_id = 7;
}
message StartEnrollmentResponse {
  string enrollment_id = 1;
  // Secret polling credential; never shown to the user.
  string device_code = 2;
  // Short code shown to the user and confirmed on the approval page.
  string user_code = 3;
  // Approval page URL that carries the enrollment ID.
  string verification_url = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Duration poll_interval = 6;
}

message EnrollmentSummary {
  string enrollment_id = 1;
  EnrollmentState state = 2;
  string device_name = 3;
  DevicePlatform platform = 4;
  CpuArchitecture architecture = 5;
  CollectorKind collector_kind = 6;
  string collector_version = 7;
  google.protobuf.Timestamp expires_at = 8;
  uint32 remaining_attempts = 9;
  // Approval reattaches an existing device of the caller.
  bool reattach = 10;
}

message GetEnrollmentRequest {
  string enrollment_id = 1;
}
message GetEnrollmentResponse {
  EnrollmentSummary enrollment = 1;
}

message ApproveEnrollmentRequest {
  string enrollment_id = 1;
  string user_code = 2;
}
message ApproveEnrollmentResponse {
  Device device = 1;
}

message RejectEnrollmentRequest {
  string enrollment_id = 1;
}
message RejectEnrollmentResponse {}

message PollEnrollmentRequest {
  string enrollment_id = 1;
  string device_code = 2;
}
message PollEnrollmentResponse {
  EnrollmentState state = 1;
  // Set only in the single response that delivers credentials.
  Device device = 2;
  DeviceCredentials credentials = 3;
}

message RefreshDeviceTokenRequest {
  string device_id = 1;
  string refresh_token = 2;
}
message RefreshDeviceTokenResponse {
  DeviceCredentials credentials = 1;
}

message RevokeDeviceCredentialsRequest {
  string device_id = 1;
  // Required without a user token; empty with a user token.
  string refresh_token = 2;
}
message RevokeDeviceCredentialsResponse {}

message ListDevicesRequest {
  Page page = 1;
}
message ListDevicesResponse {
  repeated Device devices = 1;
  string next_cursor = 2;
}

message DeleteDeviceRequest {
  string device_id = 1;
}
message DeleteDeviceResponse {
  google.protobuf.Timestamp purge_deadline = 1;
}

message SetPreferredDeviceRequest {
  // Empty clears the preference.
  string device_id = 1;
}
message SetPreferredDeviceResponse {
