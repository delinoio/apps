// ---------------------------------------------------------------------------
// LocalCollectorService: local IPC of the shared collector process
// ---------------------------------------------------------------------------

// Served only by the local collector process over a Unix domain socket or a
// Windows named pipe restricted to the current OS user. Never exposed by the
// AnyDash API.
service LocalCollectorService {
  rpc GetCollectorStatus(GetCollectorStatusRequest) returns (GetCollectorStatusResponse);
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc AddConnectionCredential(AddConnectionCredentialRequest) returns (AddConnectionCredentialResponse);
  rpc RemoveConnectionCredential(RemoveConnectionCredentialRequest) returns (RemoveConnectionCredentialResponse);
  rpc ListSourcePaths(ListSourcePathsRequest) returns (ListSourcePathsResponse);
  rpc AddSourcePath(AddSourcePathRequest) returns (AddSourcePathResponse);
  rpc DisableSourcePath(DisableSourcePathRequest) returns (DisableSourcePathResponse);
  rpc EnableSourcePath(EnableSourcePathRequest) returns (EnableSourcePathResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  rpc RequestLocalSync(RequestLocalSyncRequest) returns (RequestLocalSyncResponse);
  // Makes the collector call ConnectionService.RequestConnectionRefresh with
  // its own device token, so local clients never use the device credentials.
  rpc RequestLocalConnectionRefresh(RequestLocalConnectionRefreshRequest) returns (RequestLocalConnectionRefreshResponse);
  rpc PutNativeWidgetSnapshots(PutNativeWidgetSnapshotsRequest) returns (PutNativeWidgetSnapshotsResponse);
  rpc ListNativeWidgetSnapshots(ListNativeWidgetSnapshotsRequest) returns (ListNativeWidgetSnapshotsResponse);
  rpc Quit(QuitRequest) returns (QuitResponse);
}

message LoginProgress {
  EnrollmentState state = 1;
  string user_code = 2;
  string verification_url = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message LocalConnectionStatus {
  string connection_id = 1;
  Provider provider = 2;
  string display_name = 3;
  bool credential_present = 4;
  bool lease_held = 5;
  uint64 lease_epoch = 6;
  CollectionStatus last_status = 7;
  FailureClass failure_class = 8;
  google.protobuf.Timestamp last_success_at = 9;
  google.protobuf.Timestamp next_attempt_at = 10;
  string last_error_correlation_id = 11;
}

message CollectorStatus {
  CollectorRunState run_state = 1;
  string device_id = 2;
  string collector_version = 3;
  CollectorKind owner_kind = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp last_local_sync_at = 6;
  google.protobuf.Timestamp last_upload_at = 7;
  uint64 pending_bucket_count = 8;
  google.protobuf.Timestamp oldest_pending_bucket_start = 9;
  repeated LocalConnectionStatus connections = 10;
  repeated ParserStatus parsers = 11;
  string last_error_correlation_id = 12;
  ErrorReason last_error_reason = 13;
  google.protobuf.Timestamp last_error_at = 14;
  ClientVersionStatus version_status = 15;
  repeated LocalNotice notices = 16;
  KeySource key_source = 17;
  bool autostart_enabled = 18;
  LoginProgress login = 19;
}

message GetCollectorStatusRequest {}
message GetCollectorStatusResponse {
  CollectorStatus status = 1;
}

message StartLoginRequest {
  string device_name = 1;
}
message StartLoginResponse {
  LoginProgress login = 1;
}

message LogoutRequest {}
message LogoutResponse {}

