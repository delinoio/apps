// ---------------------------------------------------------------------------
// WidgetDataService: widget data queries
// ---------------------------------------------------------------------------

// Every WidgetDataService method requires a user token.
service WidgetDataService {
  rpc QueryWidgetData(QueryWidgetDataRequest) returns (QueryWidgetDataResponse);
  rpc QueryDashboardData(QueryDashboardDataRequest) returns (QueryDashboardDataResponse);
}

message CostEstimate {
  // VALUE, CANNOT_BE_CALCULATED or PARTIAL.
  MetricState state = 1;
  // Decimal USD string; empty unless state is VALUE or PARTIAL.
  string amount_usd = 2;
  repeated string price_version_ids = 3;
}

message UsageTotals {
  uint64 session_count = 1;
  TokenCounts tokens = 2;
  CostEstimate estimated_cost = 3;
}

message UsageSummary {
  UsageTotals totals = 1;
}

message UsagePoint {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  // UTC offset of the start in the requested time zone, in minutes.
  int32 utc_offset_minutes = 3;
  UsageTotals totals = 4;
}
message UsageSeries {
  TimeGranularity granularity = 1;
  repeated UsagePoint points = 2;
}

message UsageBreakdownRow {
  string device_id = 1;
  string device_name = 2;
  LocalTool tool = 3;
  string model = 4;
  UsageTotals totals = 5;
  ParserState parser_state = 6;
  uint64 skipped_record_count = 7;
}
message UsageBreakdown {
  UsageBreakdownDimension dimension = 1;
  repeated UsageBreakdownRow rows = 2;
  UsageTotals total = 3;
}

message MetricReading {
  string connection_id = 1;
  Provider provider = 2;
  // Empty for account-level metrics.
  string resource_id = 3;
  MetricKind kind = 4;
  string dimension = 5;
  string unit = 6;
  MetricTemporality temporality = 7;
  MetricValue current = 8;
  google.protobuf.Timestamp observed_at = 9;
  MetricValue last_success = 10;
  google.protobuf.Timestamp last_success_at = 11;
  FailureClass failure_class = 12;
  google.protobuf.Timestamp period_start = 13;
  google.protobuf.Timestamp period_end = 14;
}
message MetricPanel {
  repeated MetricReading readings = 1;
}

message MetricHistoryPoint {
  // UTC hour that the stored hourly snapshot belongs to.
  google.protobuf.Timestamp hour_start = 1;
  google.protobuf.Timestamp observed_at = 2;
  MetricValue value = 3;
}
message MetricHistorySeries {
  string connection_id = 1;
  string resource_id = 2;
  MetricKind kind = 3;
  string dimension = 4;
  string unit = 5;
  MetricTemporality temporality = 6;
  repeated MetricHistoryPoint points = 7;
}
message MetricHistory {
  repeated MetricHistorySeries series = 1;
}

message ResourceReading {
  string connection_id = 1;
  Provider provider = 2;
  string resource_id = 3;
  ResourceKind kind = 4;
  string display_name = 5;
  string parent_id = 6;
  ResourceHealth health = 7;
  string provider_status = 8;
  MetricState status_state = 9;
  google.protobuf.Timestamp observed_at = 10;
  repeated MetricReading metrics = 11;
}
message ResourceList {
  repeated ResourceReading resources = 1;
}

// WidgetSummary is the compact form used by native widgets.
message WidgetSummary {
  string title = 1;
  string primary_label = 2;
  MetricValue primary_value = 3;
  string secondary_label = 4;
  MetricValue secondary_value = 5;
  google.protobuf.Timestamp data_updated_at = 6;
}

message WidgetData {
  string widget_id = 1;
  WidgetType type = 2;
  SharingState sharing_state = 3;
  SharingEndReason sharing_end_reason = 4;
  google.protobuf.Timestamp generated_at = 5;
  string time_zone = 6;
  google.protobuf.Timestamp range_start = 7;
  google.protobuf.Timestamp range_end = 8;
  WidgetSummary summary = 9;
  repeated DataNotice notices = 10;
  // Absent when sharing_state is ENDED.
  oneof content {
    UsageSummary usage_summary = 11;
    UsageSeries usage_series = 12;
    UsageBreakdown usage_breakdown = 13;
    MetricPanel metric_panel = 14;
    MetricHistory metric_history = 15;
    ResourceList resource_list = 16;
  }
}

message QueryWidgetDataRequest {
  string dashboard_id = 1;
  string widget_id = 2;
  // IANA time zone name; empty uses the account setting.
  string time_zone = 3;
}
message QueryWidgetDataResponse {
  WidgetData data = 1;
}

message QueryDashboardDataRequest {
  string dashboard_id = 1;
  string time_zone = 2;
}
message QueryDashboardDataResponse {
  uint64 dashboard_version = 1;
  repeated WidgetData widgets = 2;
}

