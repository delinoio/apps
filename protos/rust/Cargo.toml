[package]
name = "delino-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
buffa = "0.9"
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = "0.9.1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = "0.9.0"
