// SPDX-License-Identifier: Apache-2.0
syntax = "proto3";
package delcore.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/apps/protos/delcore/v1;delcorev1";
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_BILLING = 3;
  ROLE_MEMBER = 4;
}
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_RECONCILE = 3;
  JOB_STATE_DONE = 4;
  JOB_STATE_FAILED = 5;
}
enum BlockReason {
  BLOCK_REASON_UNSPECIFIED = 0;
  BLOCK_REASON_PERMISSION = 1;
  BLOCK_REASON_OPERATOR = 2;
  BLOCK_REASON_RENEWAL = 3;
  BLOCK_REASON_DISPUTE = 4;
  BLOCK_REASON_BALANCE = 5;
  BLOCK_REASON_DELETING = 6;
}
// TenantState is the billing-independent lifecycle state of a tenant. The
// server never returns TENANT_STATE_UNSPECIFIED.
enum TenantState {
  TENANT_STATE_UNSPECIFIED = 0;
  TENANT_STATE_ACTIVE = 1;
  TENANT_STATE_BLOCKED = 2;
  TENANT_STATE_DELETING = 3;
  TENANT_STATE_DELETED = 4;
  TENANT_STATE_UNKNOWN = 5;
}
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_INPUT = 1;
  ERROR_REASON_UNAUTHENTICATED = 2;
  ERROR_REASON_FORBIDDEN = 3;
  ERROR_REASON_CONFLICT = 4;
  ERROR_REASON_PRECONDITION = 5;
  ERROR_REASON_DEPENDENCY = 6;
}
message ErrorDetail {
  ErrorReason reason = 1;
  string correlation_id = 2;
}
message Metadata {
  string correlation_id = 1;
}
message Page {
  int32 size = 1;
  string after_id = 2;
}
message Tenant {
  string id = 1;
  string name = 2;
  bool personal = 3;
  string owner_id = 4;
  string plan_id = 5;
  bool blocked = 6;
  bool deleting = 7;
  string credit_balance = 8;
  string plan_version_id = 9;
}
message Member {
  string user_id = 1;
  repeated Role roles = 2;
}
message Group {
  string id = 1;
  string name = 2;
  repeated string user_ids = 3;
  repeated Permission permissions = 4;
}
message Permission {
  string service_id = 1;
  string capability = 2;
}
message Service {
  string id = 1;
  string name = 2;
  string client_id = 3;
  repeated string capabilities = 4;
  repeated string scopes = 5;
  string key = 6;
}
message Plan {
  string id = 1;
  string name = 2;
  int32 rank = 3;
  bool free = 4;
  bool default_free = 5;
  bool postpaid = 6;
  string key = 7;
  string active_version_id = 8;
  repeated FeatureValue feature_values = 9;
}
enum PriceKind {
  PRICE_KIND_UNSPECIFIED = 0;
  PRICE_KIND_USAGE = 1;
  PRICE_KIND_RECURRING = 2;
}
message Meter {
  string service_id = 1;
  string name = 2;
  string id = 3;
  string key = 4;
  string event_type = 5;
  MeterAggregation aggregation = 6;
  string value_attribute = 7;
  repeated MeterFilter filters = 8;
  repeated string group_by = 9;
}
message AddOn {
  string id = 1;
  string service_id = 2;
  string name = 3;
  string key = 4;
  string active_version_id = 5;
  repeated FeatureValue feature_values = 6;
}
message Price {
  string id = 1;
  string plan_id = 2;
  string service_id = 3;
  string meter = 4;
  string unit_price = 5;
  string included = 6;
  string currency = 7;
  string external_price_id = 8;
  string add_on_id = 9;
  PriceKind kind = 10;
  string key = 11;
  string stable_id = 12;
  bool active = 13;
}
enum MeterAggregation {
  METER_AGGREGATION_UNSPECIFIED = 0;
  METER_AGGREGATION_COUNT = 1;
  METER_AGGREGATION_SUM = 2;
  METER_AGGREGATION_MIN = 3;
  METER_AGGREGATION_MAX = 4;
  METER_AGGREGATION_AVG = 5;
  METER_AGGREGATION_UNIQUE_COUNT = 6;
}
enum MeterFilterOperator {
  METER_FILTER_OPERATOR_UNSPECIFIED = 0;
  METER_FILTER_OPERATOR_EQUAL = 1;
  METER_FILTER_OPERATOR_NOT_EQUAL = 2;
  METER_FILTER_OPERATOR_IN = 3;
  METER_FILTER_OPERATOR_GREATER = 4;
  METER_FILTER_OPERATOR_GREATER_OR_EQUAL = 5;
  METER_FILTER_OPERATOR_LESS = 6;
  METER_FILTER_OPERATOR_LESS_OR_EQUAL = 7;
  METER_FILTER_OPERATOR_EXISTS = 8;
}
message MeterFilter {
  string attribute = 1;
  MeterFilterOperator operator = 2;
  repeated string values = 3;
}
enum FeatureKind {
  FEATURE_KIND_UNSPECIFIED = 0;
  FEATURE_KIND_ACCESS = 1;
  FEATURE_KIND_METERED = 2;
  FEATURE_KIND_CONFIGURATION = 3;
}
enum ConfigurationValueType {
  CONFIGURATION_VALUE_TYPE_UNSPECIFIED = 0;
  CONFIGURATION_VALUE_TYPE_BOOLEAN = 1;
  CONFIGURATION_VALUE_TYPE_INTEGER = 2;
  CONFIGURATION_VALUE_TYPE_DECIMAL = 3;
  CONFIGURATION_VALUE_TYPE_STRING = 4;
  CONFIGURATION_VALUE_TYPE_STRING_LIST = 5;
}
message Feature {
  string id = 1;
  string service_id = 2;
  string key = 3;
  string name = 4;
  FeatureKind kind = 5;
  ConfigurationValueType value_type = 6;
  string meter_key = 7;
}
message StringList {
  repeated string values = 1;
}
message ConfigurationValue {
  oneof value {
    bool boolean = 1;
    int64 integer = 2;
    string decimal = 3;
    string text = 4;
    StringList string_list = 5;
  }
}
message FeatureValue {
  string feature_id = 1;
  optional bool enabled = 2;
  string limit = 3;
  ConfigurationValue configuration = 4;
}
message Usage {
  string id = 1;
  string tenant_id = 2;
  string service_id = 3;
  string event_key = 4;
  string meter = 5;
  string quantity = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string correction_of = 8;
}
message LedgerEntry {
  string id = 1;
  string kind = 2;
  string amount = 3;
  string meter = 4;
  google.protobuf.Timestamp created_at = 5;
  string usage_id = 6;
}
message Job {
  string id = 1;
  string kind = 2;
  JobState state = 3;
  string error_category = 4;
  int32 attempts = 5;
  string checkout_url = 6;
}
message AuditEntry {
  string id = 1;
  string actor_id = 2;
  string action = 3;
  string reason = 4;
  google.protobuf.Timestamp created_at = 5;
}
message GetCurrentUserRequest {
  Page page = 1;
}
message GetCurrentUserResponse {
  Metadata metadata = 1;
  string user_id = 2;
  repeated Tenant tenants = 3;
  string next_after_id = 4;
}
message CreateTenantRequest {
  string request_key = 1;
  string name = 2;
}
message CreateTenantResponse {
  Metadata metadata = 1;
  Tenant tenant = 2;
}
message GetTenantRequest {
  string tenant_id = 1;
}
message GetTenantResponse {
  Metadata metadata = 1;
  Tenant tenant = 2;
}
message ListMembersRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListMembersResponse {
  Metadata metadata = 1;
  repeated Member members = 2;
  string next_after_id = 3;
}
message SetMemberRolesRequest {
  string request_key = 1;
  string tenant_id = 2;
  string user_id = 3;
  repeated Role roles = 4;
}
message SetMemberRolesResponse {
  Metadata metadata = 1;
}
message RemoveMemberRequest {
  string request_key = 1;
  string tenant_id = 2;
  string user_id = 3;
}
message RemoveMemberResponse {
  Metadata metadata = 1;
}
message CreateInvitationRequest {
  string request_key = 1;
  string tenant_id = 2;
  string email = 3;
  repeated Role roles = 4;
  string return_url = 5;
}
message CreateInvitationResponse {
  Metadata metadata = 1;
  string invitation_id = 2;
}
message AcceptInvitationRequest {
  string request_key = 1;
  string token = 2;
}
message AcceptInvitationResponse {
  Metadata metadata = 1;
  string tenant_id = 2;
}
message RevokeInvitationRequest {
  string request_key = 1;
  string tenant_id = 2;
  string invitation_id = 3;
}
message RevokeInvitationResponse {
  Metadata metadata = 1;
}
message TransferOwnershipRequest {
  string request_key = 1;
  string tenant_id = 2;
  string recipient_id = 3;
}
message TransferOwnershipResponse {
  Metadata metadata = 1;
  string transfer_id = 2;
}
message AcceptOwnershipRequest {
  string request_key = 1;
  string tenant_id = 2;
  string transfer_id = 3;
}
message AcceptOwnershipResponse {
  Metadata metadata = 1;
}
message SetGroupRequest {
  string request_key = 1;
  string tenant_id = 2;
  Group group = 3;
}
message SetGroupResponse {
  Metadata metadata = 1;
  Group group = 2;
}
message ListGroupsRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListGroupsResponse {
  Metadata metadata = 1;
  repeated Group groups = 2;
  string next_after_id = 3;
}
message GetCatalogRequest {
  Page page = 1;
}
message GetCatalogResponse {
  Metadata metadata = 1;
  repeated Service services = 2;
  repeated Plan plans = 3;
  repeated Price prices = 4;
  repeated AddOn add_ons = 6;
  repeated Meter meters = 7;
  repeated Feature features = 8;
  string next_after_id = 5;
}
message PutMeterRequest {
  string request_key = 1;
  Meter meter = 2;
  string reason = 3;
}
message PutMeterResponse {
  Metadata metadata = 1;
  Meter meter = 2;
}
message PutFeatureRequest {
  string request_key = 1;
  Feature feature = 2;
  string reason = 3;
}
message PutFeatureResponse {
  Metadata metadata = 1;
  Feature feature = 2;
}
message PutAddOnRequest {
  string request_key = 1;
  AddOn add_on = 2;
  string reason = 3;
  bool replace_feature_values = 4;
}
message PutAddOnResponse {
  Metadata metadata = 1;
  AddOn add_on = 2;
}
message ListBillingHistoryRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListBillingHistoryResponse {
  Metadata metadata = 1;
  repeated Job jobs = 2;
  string next_after_id = 3;
}
message PutServiceRequest {
  string request_key = 1;
  Service service = 2;
  string reason = 3;
}
message PutServiceResponse {
  Metadata metadata = 1;
  Service service = 2;
}
message PutPlanRequest {
  string request_key = 1;
  Plan plan = 2;
  string reason = 3;
  bool replace_feature_values = 4;
}
message PutPlanResponse {
  Metadata metadata = 1;
  Plan plan = 2;
}
message CreatePriceRequest {
  string request_key = 1;
  Price price = 2;
  string reason = 3;
}
message CreatePriceResponse {
  Metadata metadata = 1;
  Price price = 2;
}
message AuthorizeRequest {
  string tenant_id = 1;
  string user_id = 2;
  string capability = 3;
  bool paid = 4;
}
message AuthorizeResponse {
  Metadata metadata = 1;
  bool allowed = 2;
  repeated BlockReason reasons = 3;
}
// Service-scoped lifecycle checks expose only finalized deletion for known IDs.
message CheckTenantLifecycleRequest {
  repeated string tenant_ids = 1;
}
message CheckTenantLifecycleResponse {
  Metadata metadata = 1;
  repeated string finalized_tenant_ids = 2;
}
// Service-scoped state checks expose only operator blocking and deletion
// progress, never billing eligibility or personal data.
message GetTenantStatesRequest {
  repeated string tenant_ids = 1;
}
message TenantStateEntry {
  string tenant_id = 1;
  TenantState state = 2;
}
message GetTenantStatesResponse {
  Metadata metadata = 1;
  // One entry per requested tenant ID, in request order.
  repeated TenantStateEntry states = 2;
}
message ReportUsageRequest {
  string request_key = 1;
  Usage usage = 2;
}
message ReportUsageResponse {
  Metadata metadata = 1;
  string usage_id = 2;
}
message CorrectUsageRequest {
  string request_key = 1;
  Usage usage = 2;
}
message CorrectUsageResponse {
  Metadata metadata = 1;
  string usage_id = 2;
}
message ListUsageRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListUsageResponse {
  Metadata metadata = 1;
  repeated Usage events = 2;
  string next_after_id = 3;
}
message ListLedgerRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListLedgerResponse {
  Metadata metadata = 1;
  repeated LedgerEntry entries = 2;
  string next_after_id = 3;
}
message RequestTopUpRequest {
  string request_key = 1;
  string tenant_id = 2;
  string amount = 3;
  string return_url = 4;
}
message RequestTopUpResponse {
  Metadata metadata = 1;
  string job_id = 2;
}
message SetAutoTopUpRequest {
  string request_key = 1;
  string tenant_id = 2;
  bool enabled = 3;
  string threshold = 4;
  string amount = 5;
  string monthly_cap = 6;
}
message SetAutoTopUpResponse {
  Metadata metadata = 1;
}
message ChangeSubscriptionRequest {
  string request_key = 1;
  string tenant_id = 2;
  string plan_id = 3;
  repeated string price_ids = 4;
  string return_url = 5;
}
message ChangeSubscriptionResponse {
  Metadata metadata = 1;
  string job_id = 2;
}
message CancelSubscriptionRequest {
  string request_key = 1;
  string tenant_id = 2;
}
message CancelSubscriptionResponse {
  Metadata metadata = 1;
  string job_id = 2;
}
message DeleteTenantRequest {
  string request_key = 1;
  string tenant_id = 2;
}
message DeleteTenantResponse {
  Metadata metadata = 1;
}
message WithdrawRequest {
  string request_key = 1;
}
message WithdrawResponse {
  Metadata metadata = 1;
}
message SetTenantBlockedRequest {
  string request_key = 1;
  string tenant_id = 2;
  bool blocked = 3;
  string reason = 4;
}
message SetTenantBlockedResponse {
  Metadata metadata = 1;
}
message ListJobsRequest {
  Page page = 1;
}
message ListJobsResponse {
  Metadata metadata = 1;
  repeated Job jobs = 2;
  string next_after_id = 3;
}
message RetryJobRequest {
  string request_key = 1;
  string job_id = 2;
  string reason = 3;
}
message RetryJobResponse {
  Metadata metadata = 1;
}
message ListAuditRequest {
  Page page = 1;
}
message ListAuditResponse {
  Metadata metadata = 1;
  repeated AuditEntry entries = 2;
  string next_after_id = 3;
}
message DeleteGroupRequest {
  string request_key = 1;
  string tenant_id = 2;
  string group_id = 3;
}
message DeleteGroupResponse {
  Metadata metadata = 1;
}
service DelcoreService {
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc PutMeter(PutMeterRequest) returns (PutMeterResponse);
  rpc PutFeature(PutFeatureRequest) returns (PutFeatureResponse);
  rpc PutAddOn(PutAddOnRequest) returns (PutAddOnResponse);
  rpc ListBillingHistory(ListBillingHistoryRequest) returns (ListBillingHistoryResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc SetMemberRoles(SetMemberRolesRequest) returns (SetMemberRolesResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  rpc AcceptOwnership(AcceptOwnershipRequest) returns (AcceptOwnershipResponse);
  rpc SetGroup(SetGroupRequest) returns (SetGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
  rpc PutService(PutServiceRequest) returns (PutServiceResponse);
  rpc PutPlan(PutPlanRequest) returns (PutPlanResponse);
  rpc CreatePrice(CreatePriceRequest) returns (CreatePriceResponse);
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc CheckTenantLifecycle(CheckTenantLifecycleRequest) returns (CheckTenantLifecycleResponse);
  rpc GetTenantStates(GetTenantStatesRequest) returns (GetTenantStatesResponse);
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse);
  rpc CorrectUsage(CorrectUsageRequest) returns (CorrectUsageResponse);
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse);
  rpc ListLedger(ListLedgerRequest) returns (ListLedgerResponse);
  rpc RequestTopUp(RequestTopUpRequest) returns (RequestTopUpResponse);
  rpc SetAutoTopUp(SetAutoTopUpRequest) returns (SetAutoTopUpResponse);
  rpc ChangeSubscription(ChangeSubscriptionRequest) returns (ChangeSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
  rpc SetTenantBlocked(SetTenantBlockedRequest) returns (SetTenantBlockedResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);
}
