}
message SetMemberRolesResponse {
  Metadata metadata = 1;
}
message RemoveMemberRequest {
  string request_key = 1;
  string tenant_id = 2;
  string user_id = 3;
}
message RemoveMemberResponse {
  Metadata metadata = 1;
}
message CreateInvitationRequest {
  string request_key = 1;
  string tenant_id = 2;
  string email = 3;
  repeated Role roles = 4;
  string return_url = 5;
}
message CreateInvitationResponse {
  Metadata metadata = 1;
  string invitation_id = 2;
}
message AcceptInvitationRequest {
  string request_key = 1;
  string token = 2;
}
message AcceptInvitationResponse {
  Metadata metadata = 1;
  string tenant_id = 2;
}
message RevokeInvitationRequest {
  string request_key = 1;
  string tenant_id = 2;
  string invitation_id = 3;
}
message RevokeInvitationResponse {
  Metadata metadata = 1;
}
message TransferOwnershipRequest {
  string request_key = 1;
  string tenant_id = 2;
  string recipient_id = 3;
}
message TransferOwnershipResponse {
  Metadata metadata = 1;
  string transfer_id = 2;
}
message AcceptOwnershipRequest {
  string request_key = 1;
  string tenant_id = 2;
  string transfer_id = 3;
}
message AcceptOwnershipResponse {
  Metadata metadata = 1;
}
message SetGroupRequest {
  string request_key = 1;
  string tenant_id = 2;
  Group group = 3;
}
message SetGroupResponse {
  Metadata metadata = 1;
  Group group = 2;
}
message ListGroupsRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListGroupsResponse {
  Metadata metadata = 1;
  repeated Group groups = 2;
  string next_after_id = 3;
}
message GetCatalogRequest {
  Page page = 1;
}
message GetCatalogResponse {
  Metadata metadata = 1;
  repeated Service services = 2;
  repeated Plan plans = 3;
  repeated Price prices = 4;
  repeated AddOn add_ons = 6;
  repeated Meter meters = 7;
  repeated Feature features = 8;
  string next_after_id = 5;
}
message PutMeterRequest {
  string request_key = 1;
  Meter meter = 2;
  string reason = 3;
}
message PutMeterResponse {
  Metadata metadata = 1;
  Meter meter = 2;
}
message PutFeatureRequest {
  string request_key = 1;
  Feature feature = 2;
  string reason = 3;
}
message PutFeatureResponse {
  Metadata metadata = 1;
  Feature feature = 2;
}
message PutAddOnRequest {
  string request_key = 1;
  AddOn add_on = 2;
  string reason = 3;
  bool replace_feature_values = 4;
}
message PutAddOnResponse {
  Metadata metadata = 1;
  AddOn add_on = 2;
}
message ListBillingHistoryRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListBillingHistoryResponse {
  Metadata metadata = 1;
  repeated Job jobs = 2;
  string next_after_id = 3;
}
message PutServiceRequest {
  string request_key = 1;
  Service service = 2;
  string reason = 3;
}
message PutServiceResponse {
  Metadata metadata = 1;
  Service service = 2;
}
message PutPlanRequest {
  string request_key = 1;
  Plan plan = 2;
  string reason = 3;
  bool replace_feature_values = 4;
}
message PutPlanResponse {
  Metadata metadata = 1;
  Plan plan = 2;
}
message CreatePriceRequest {
  string request_key = 1;
  Price price = 2;
  string reason = 3;
}
message CreatePriceResponse {
  Metadata metadata = 1;
  Price price = 2;
}
message AuthorizeRequest {
  string tenant_id = 1;
  string user_id = 2;
  string capability = 3;
  bool paid = 4;
  // Optional key of a feature declared by the calling service. An empty key
  // keeps the permission and billing result unchanged and returns no feature.
  string feature_key = 5;
  // Values that select one group of a metered feature's meter. Supply exactly
  // the meter's group-by attributes with the scalar types used for ingestion.
  // Access and configuration features take no group values.
  map<string, AttributeValue> group_values = 6;
}
message AuthorizeResponse {
  Metadata metadata = 1;
  bool allowed = 2;
  repeated BlockReason reasons = 3;
  // Present when feature_key names a known feature and the permission check
  // passed. Feature block reasons are also listed in reasons.
  FeatureAuthorization feature = 4;
}
// FeatureAuthorization evaluates one feature against the plan and add-on
// versions pinned for the tenant at the request time. Feature access never
// replaces the permission and billing checks of AuthorizeRequest.
message FeatureAuthorization {
  string feature_id = 1;
  FeatureKind kind = 2;
  // True when a pinned plan or add-on grants the feature. An access feature is
  // entitled only when the grant enables it.
  bool entitled = 3;
  // Metered features: per-group limit of the pinned grant as a canonical
  // decimal.
  string limit = 4;
  // Metered features: last applied aggregate of the selected group in the
  // current billing period, or "0" without applied events. Ingestion is
  // asynchronous: accepted but unprocessed events are not included, so a
  // successful IngestEvent does not imply a changed usage value. Execution
  // allowed before processing catches up can exceed the limit.
  string usage = 5;
  // Metered features: the current billing period, a Paddle renewal period for
  // paid subscriptions or the UTC calendar month otherwise.
  google.protobuf.Timestamp period_start = 6;
  google.protobuf.Timestamp period_end = 7;
  // Configuration features: the typed value of the pinned grant.
  ConfigurationValue configuration = 8;
}
// MeterAggregate is one applied group aggregate of a tenant meter billing
// period. Aggregates update asynchronously after ingestion; a successful
// IngestEvent or CorrectEvent does not imply that an aggregate includes it.
message MeterAggregate {
  map<string, AttributeValue> group_values = 1;
  // Exposed value: the count, sum, minimum, maximum, exact distinct count, or
  // the exact average rounded half-up to six decimal places.
  string value = 2;
  // Exact number of applied events in the group.
  int64 event_count = 3;
  // Exact sum of applied numeric values; "0" for count and unique count.
  string sum = 4;
  // Exact distinct values for min, max, and unique count; zero otherwise.
  int64 distinct_count = 5;
  google.protobuf.Timestamp updated_at = 6;
}
// ListMeterAggregatesRequest selects one meter by service and stable key.
// Page.after_id carries the opaque next_after_id of a previous response.
message ListMeterAggregatesRequest {
  string tenant_id = 1;
  // Service that owns the meter. Service callers may leave it empty and can
  // only read their own meters.
  string service_id = 2;
  string meter_key = 3;
  // Any instant in the requested billing period. Unset selects the period
  // that contains the request time.
  google.protobuf.Timestamp period_at = 4;
  Page page = 5;
}
message ListMeterAggregatesResponse {
  Metadata metadata = 1;
  string meter_id = 2;
  MeterAggregation aggregation = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
  // Applied group aggregates ordered by an internal group key.
  repeated MeterAggregate aggregates = 6;
  string next_after_id = 7;
}
// MeteringFailureCategory classifies the last recorded failure of metering
// work. Use ListJobs and RetryJob to inspect and reprocess failed jobs.
enum MeteringFailureCategory {
  METERING_FAILURE_CATEGORY_UNSPECIFIED = 0;
  // A transient failure; the job waits for an automatic retry.
  METERING_FAILURE_CATEGORY_TRANSIENT = 1;
  // Automatic retries are exhausted; the job needs RetryJob.
  METERING_FAILURE_CATEGORY_RETRY_EXHAUSTED = 2;
  // Stored metering state is inconsistent; automatic retries cannot fix it.
  METERING_FAILURE_CATEGORY_INVALID_STATE = 3;
  // The job payload is unreadable.
  METERING_FAILURE_CATEGORY_INVALID_PAYLOAD = 4;
}
message MeteringFailureCount {
  MeteringFailureCategory category = 1;
  int64 jobs = 2;
}
// GetMeteringStatusRequest reads processing lag and failure state of one
// tenant, or service-wide state for platform operators when tenant_id is
// empty.
message GetMeteringStatusRequest {
  string tenant_id = 1;
}
message GetMeteringStatusResponse {
  Metadata metadata = 1;
  // Accepted events whose latest revision is not applied yet, including
  // events whose processing failed.
  int64 unapplied_events = 2;
  // Metering jobs that wait for processing or an automatic retry.
  int64 pending_jobs = 3;
  // Acceptance time of the oldest pending job; unset without pending jobs.
  google.protobuf.Timestamp oldest_pending_at = 4;
  // Age of the oldest pending job at the request time in whole seconds.
  int64 lag_seconds = 5;
  // Metering jobs that failed and wait for an operator RetryJob.
  int64 failed_jobs = 6;
  // Unfinished jobs per last recorded failure category.
  repeated MeteringFailureCount failures = 7;
  // Most recent failure among unfinished jobs; unset when none is recorded.
  google.protobuf.Timestamp last_failure_at = 8;
  MeteringFailureCategory last_failure_category = 9;
}
// Service-scoped lifecycle checks expose only finalized deletion for known IDs.
message CheckTenantLifecycleRequest {
  repeated string tenant_ids = 1;
}
message CheckTenantLifecycleResponse {
  Metadata metadata = 1;
  repeated string finalized_tenant_ids = 2;
}
// Service-scoped state checks expose only operator blocking and deletion
// progress, never billing eligibility or personal data.
message GetTenantStatesRequest {
  repeated string tenant_ids = 1;
}
message TenantStateEntry {
  string tenant_id = 1;
  TenantState state = 2;
}
message GetTenantStatesResponse {
  Metadata metadata = 1;
  // One entry per requested tenant ID, in request order.
  repeated TenantStateEntry states = 2;
}
message ReportUsageRequest {
  string request_key = 1;
  Usage usage = 2;
}
message ReportUsageResponse {
  Metadata metadata = 1;
  string usage_id = 2;
}
message CorrectUsageRequest {
  string request_key = 1;
  Usage usage = 2;
}
message CorrectUsageResponse {
  Metadata metadata = 1;
  string usage_id = 2;
}
// IngestEvent durably accepts one event. A response promises durable storage
// and queued aggregation, not updated aggregates.
message IngestEventRequest {
  string request_key = 1;
  Event event = 2;
}
message IngestEventResponse {
  Metadata metadata = 1;
  string event_id = 2;
  // Revision accepted for this request. An original event is revision 1.
  int32 revision = 3;
}
// CorrectEvent replaces or cancels a prior event of the calling service.
// expected_revision must equal the latest accepted revision of the event.
message CorrectEventRequest {
  string request_key = 1;
  string tenant_id = 2;
  string event_key = 3;
  int32 expected_revision = 4;
  EventCorrectionKind kind = 5;
  // Replacement content. Both fields must be empty for a cancellation.
  string event_type = 6;
  map<string, AttributeValue> attributes = 7;
}
message CorrectEventResponse {
  Metadata metadata = 1;
  string event_id = 2;
  // New latest revision created by this correction.
  int32 revision = 3;
}
message GetEventRequest {
  string tenant_id = 1;
  string event_key = 2;
}
message GetEventResponse {
  Metadata metadata = 1;
  // Latest accepted content. A cancelled event keeps its identity and
  // occurrence fields with an empty type and attribute map.
  Event event = 2;
  int32 revision = 3;
  bool cancelled = 4;
  // Latest revision materialized by asynchronous processing. It trails
  // revision while work is pending or failed.
  int32 applied_revision = 5;
}
message ListUsageRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListUsageResponse {
  Metadata metadata = 1;
  repeated Usage events = 2;
  string next_after_id = 3;
}
message ListLedgerRequest {
  string tenant_id = 1;
  Page page = 2;
}
message ListLedgerResponse {
  Metadata metadata = 1;
  repeated LedgerEntry entries = 2;
  string next_after_id = 3;
}
message RequestTopUpRequest {
  string request_key = 1;
  string tenant_id = 2;
