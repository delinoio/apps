syntax = "proto3";
package delcore.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/apps/protos/delcore/v1;delcorev1";
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_BILLING = 3;
  ROLE_MEMBER = 4;
}
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PENDING = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_RECONCILE = 3;
  JOB_STATE_DONE = 4;
  JOB_STATE_FAILED = 5;
}
enum BlockReason {
  BLOCK_REASON_UNSPECIFIED = 0;
  BLOCK_REASON_PERMISSION = 1;
  BLOCK_REASON_OPERATOR = 2;
  BLOCK_REASON_RENEWAL = 3;
  BLOCK_REASON_DISPUTE = 4;
  BLOCK_REASON_BALANCE = 5;
  BLOCK_REASON_DELETING = 6;
  // Feature authorization only: the calling service declares no feature with
  // the requested key.
  BLOCK_REASON_FEATURE_UNKNOWN = 7;
  // Feature authorization only: the plan and add-on versions pinned for the
  // tenant at the request time do not grant the feature, or they disable an
  // access feature.
  BLOCK_REASON_FEATURE_NOT_ENTITLED = 8;
  // Feature authorization only: the last applied aggregate of the selected
  // group reached the metered feature limit in the current billing period.
  BLOCK_REASON_FEATURE_LIMIT_REACHED = 9;
}
// TenantState is the billing-independent lifecycle state of a tenant. The
// server never returns TENANT_STATE_UNSPECIFIED.
enum TenantState {
  TENANT_STATE_UNSPECIFIED = 0;
  TENANT_STATE_ACTIVE = 1;
  TENANT_STATE_BLOCKED = 2;
  TENANT_STATE_DELETING = 3;
  TENANT_STATE_DELETED = 4;
  TENANT_STATE_UNKNOWN = 5;
}
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_INPUT = 1;
  ERROR_REASON_UNAUTHENTICATED = 2;
  ERROR_REASON_FORBIDDEN = 3;
  ERROR_REASON_CONFLICT = 4;
  ERROR_REASON_PRECONDITION = 5;
  ERROR_REASON_DEPENDENCY = 6;
  // An event correction named a revision that is no longer the latest one.
  // Re-read the event with GetEvent before deciding on a new correction.
  ERROR_REASON_STALE_REVISION = 7;
  // No catalog meter of the calling service matches the event type and filters.
  ERROR_REASON_NO_MATCHING_METER = 8;
  // A matched meter lacks a required attribute, receives the wrong attribute
  // type, or an attribute is not a valid flat scalar. Authorize also returns it
  // for group values that do not match a metered feature's meter.
  ERROR_REASON_INVALID_ATTRIBUTE = 9;
  // Accepting the event would exceed the configured group or distinct-value
  // bound of a tenant meter billing period.
  ERROR_REASON_CARDINALITY_EXCEEDED = 10;
  // The service-scoped event key was already accepted with different content.
  ERROR_REASON_EVENT_IDENTITY_CONFLICT = 11;
  // The calling service has no retained event with the requested key.
  ERROR_REASON_EVENT_NOT_FOUND = 12;
  // The event was cancelled; a cancelled event cannot be corrected again.
  ERROR_REASON_EVENT_CANCELLED = 13;
  // The occurrence is older than the accepted lateness bound or the tenant
  // reporting grace period has ended.
  ERROR_REASON_REPORTING_WINDOW_CLOSED = 14;
}
message ErrorDetail {
  ErrorReason reason = 1;
  string correlation_id = 2;
}
message Metadata {
  string correlation_id = 1;
}
message Page {
  int32 size = 1;
  string after_id = 2;
}
message Tenant {
  string id = 1;
  string name = 2;
  bool personal = 3;
  string owner_id = 4;
  string plan_id = 5;
  bool blocked = 6;
  bool deleting = 7;
  string credit_balance = 8;
  string plan_version_id = 9;
}
message Member {
  string user_id = 1;
  repeated Role roles = 2;
}
message Group {
  string id = 1;
  string name = 2;
  repeated string user_ids = 3;
  repeated Permission permissions = 4;
}
message Permission {
  string service_id = 1;
  string capability = 2;
}
message Service {
  string id = 1;
  string name = 2;
  string client_id = 3;
  repeated string capabilities = 4;
  repeated string scopes = 5;
  string key = 6;
}
message Plan {
  string id = 1;
  string name = 2;
  int32 rank = 3;
  bool free = 4;
  bool default_free = 5;
  bool postpaid = 6;
  string key = 7;
  string active_version_id = 8;
  repeated FeatureValue feature_values = 9;
}
enum PriceKind {
  PRICE_KIND_UNSPECIFIED = 0;
  PRICE_KIND_USAGE = 1;
  PRICE_KIND_RECURRING = 2;
}
message Meter {
  string service_id = 1;
  string name = 2;
  string id = 3;
  string key = 4;
  string event_type = 5;
  MeterAggregation aggregation = 6;
  string value_attribute = 7;
  repeated MeterFilter filters = 8;
  repeated string group_by = 9;
}
message AddOn {
  string id = 1;
  string service_id = 2;
  string name = 3;
  string key = 4;
  string active_version_id = 5;
  repeated FeatureValue feature_values = 6;
}
message Price {
  string id = 1;
  string plan_id = 2;
  string service_id = 3;
  string meter = 4;
  string unit_price = 5;
  string included = 6;
  string currency = 7;
  string external_price_id = 8;
  string add_on_id = 9;
  PriceKind kind = 10;
  string key = 11;
  string stable_id = 12;
  bool active = 13;
}
enum MeterAggregation {
  METER_AGGREGATION_UNSPECIFIED = 0;
  METER_AGGREGATION_COUNT = 1;
  METER_AGGREGATION_SUM = 2;
  METER_AGGREGATION_MIN = 3;
  METER_AGGREGATION_MAX = 4;
  METER_AGGREGATION_AVG = 5;
  METER_AGGREGATION_UNIQUE_COUNT = 6;
}
enum MeterFilterOperator {
  METER_FILTER_OPERATOR_UNSPECIFIED = 0;
  METER_FILTER_OPERATOR_EQUAL = 1;
  METER_FILTER_OPERATOR_NOT_EQUAL = 2;
  METER_FILTER_OPERATOR_IN = 3;
  METER_FILTER_OPERATOR_GREATER = 4;
  METER_FILTER_OPERATOR_GREATER_OR_EQUAL = 5;
  METER_FILTER_OPERATOR_LESS = 6;
  METER_FILTER_OPERATOR_LESS_OR_EQUAL = 7;
  METER_FILTER_OPERATOR_EXISTS = 8;
}
message MeterFilter {
  string attribute = 1;
  MeterFilterOperator operator = 2;
  repeated string values = 3;
}
enum FeatureKind {
  FEATURE_KIND_UNSPECIFIED = 0;
  FEATURE_KIND_ACCESS = 1;
  FEATURE_KIND_METERED = 2;
  FEATURE_KIND_CONFIGURATION = 3;
}
enum ConfigurationValueType {
  CONFIGURATION_VALUE_TYPE_UNSPECIFIED = 0;
  CONFIGURATION_VALUE_TYPE_BOOLEAN = 1;
  CONFIGURATION_VALUE_TYPE_INTEGER = 2;
  CONFIGURATION_VALUE_TYPE_DECIMAL = 3;
  CONFIGURATION_VALUE_TYPE_STRING = 4;
  CONFIGURATION_VALUE_TYPE_STRING_LIST = 5;
}
message Feature {
  string id = 1;
  string service_id = 2;
  string key = 3;
  string name = 4;
  FeatureKind kind = 5;
  ConfigurationValueType value_type = 6;
  string meter_key = 7;
}
message StringList {
  repeated string values = 1;
}
message ConfigurationValue {
  oneof value {
    bool boolean = 1;
    int64 integer = 2;
    string decimal = 3;
    string text = 4;
    StringList string_list = 5;
  }
}
message FeatureValue {
  string feature_id = 1;
  optional bool enabled = 2;
  string limit = 3;
  ConfigurationValue configuration = 4;
}
message Usage {
  string id = 1;
  string tenant_id = 2;
  string service_id = 3;
  string event_key = 4;
  string meter = 5;
  string quantity = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string correction_of = 8;
}
// AttributeValue is one flat event attribute. Nested objects and lists are not
// supported. Numbers are canonical decimal strings, never binary floats.
message AttributeValue {
  oneof value {
    string text = 1;
    bool boolean = 2;
    string number = 3;
  }
}
// Event is a measured occurrence reported by a registered service. The
// service-scoped event key is the durable identity; id is assigned by Delcore.
message Event {
  string id = 1;
  string tenant_id = 2;
  string service_id = 3;
  string event_key = 4;
  string event_type = 5;
  google.protobuf.Timestamp occurred_at = 6;
  map<string, AttributeValue> attributes = 7;
}
enum EventCorrectionKind {
  EVENT_CORRECTION_KIND_UNSPECIFIED = 0;
  // Replace the complete event type and attribute map.
  EVENT_CORRECTION_KIND_REPLACE = 1;
  // Cancel the event. A cancelled event cannot be corrected again.
  EVENT_CORRECTION_KIND_CANCEL = 2;
}
message LedgerEntry {
  string id = 1;
  string kind = 2;
  string amount = 3;
  string meter = 4;
  google.protobuf.Timestamp created_at = 5;
  string usage_id = 6;
}
message Job {
  string id = 1;
  string kind = 2;
  JobState state = 3;
  string error_category = 4;
  int32 attempts = 5;
  string checkout_url = 6;
}
message AuditEntry {
  string id = 1;
  string actor_id = 2;
  string action = 3;
  string reason = 4;
  google.protobuf.Timestamp created_at = 5;
}
message GetCurrentUserRequest {
  Page page = 1;
}
message GetCurrentUserResponse {
  Metadata metadata = 1;
  string user_id = 2;
  repeated Tenant tenants = 3;
  string next_after_id = 4;
}
message CreateTenantRequest {
