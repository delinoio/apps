version: v2
# Schemas share the output tree; never delete it before generation.
clean: false
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: protos
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
    out: protos
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: protos
    opt: target=ts
inputs:
  - directory: protos
    paths:
      - protos/delcore/v1
      - protos/gittracker/v1
      - protos/delitools/v1
