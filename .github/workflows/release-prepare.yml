name: Prepare changeset release
on:
  workflow_call:
    outputs:
      revision:
        value: ${{ jobs.prepare.outputs.revision }}
      core:
        value: ${{ jobs.prepare.outputs.core }}
      servers:
        value: ${{ jobs.prepare.outputs.servers }}
      web:
        value: ${{ jobs.prepare.outputs.web }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      core: ${{ steps.source.outputs.core }}
      servers: ${{ steps.source.outputs.servers }}
      web: ${{ steps.source.outputs.web }}
    steps:
      - name: Create release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: apps
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          # The bot token allows the release commit to start ordinary main CI.
          # Checkout removes its persisted credential in the post-job cleanup.
          token: ${{ steps.bot.outputs.token }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve release bot commit identity
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          login="${BOT_SLUG}[bot]"
          id=$(gh api "users/$login" --jq .id)
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Consume changesets and push the release commit
        id: source
        run: node "scripts/release/changesets.mjs"
