name: Release FixKey
run-name: Release fixkey (${{ github.event_name == 'push' && github.ref_name || inputs.tag }})

on:
  push:
    tags: ["fixkey@v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable fixkey@vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions: {}
concurrency:
  group: release-fixkey
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'delinoio/apps' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify the immutable tagged source belongs to main
        id: source
        env:
          RELEASE_PROJECT: fixkey
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node "scripts/release/project.mjs" validate-source

  prepare:
    needs: source
    runs-on: ubuntu-latest
    environment: fixkey-signing
    permissions:
      contents: read
    outputs:
      version: ${{ needs.source.outputs.version }}
      revision: ${{ needs.source.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require reviewed native acceptance for this exact source
        id: source
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_REVISION: ${{ needs.source.outputs.revision }}
          FIXKEY_NATIVE_ACCEPTANCE_REVISION: ${{ vars.FIXKEY_NATIVE_ACCEPTANCE_REVISION }}
          FIXKEY_UPDATER_PUBLIC_KEY: ${{ vars.FIXKEY_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FIXKEY_NATIVE_ACCEPTANCE_REVISION" = "$RELEASE_REVISION"
          test -n "$FIXKEY_UPDATER_PUBLIC_KEY"
          node scripts/release/fixkey.mjs source "$RELEASE_VERSION"

  build:
    needs: prepare
    environment: fixkey-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux-x11-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      FIXKEY_UPDATER_PUBLIC_KEY: ${{ vars.FIXKEY_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add '${{ matrix.target }}'
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Verify source and hydrated dictionaries
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/fixkey.mjs source "$RELEASE_VERSION"
          cargo test --locked -p fixkey-core --test dictionaries
      - name: Validate UI and native contracts without application interaction
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter fixkey-desktop test
          cargo test --locked -p fixkey --features desktop --lib
          cargo clippy --locked -p fixkey-core --features native --all-targets -- -D warnings
          cargo clippy --locked -p fixkey --features desktop --all-targets -- -D warnings
      - name: Build installers and signed updater payloads
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FIXKEY_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FIXKEY_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.FIXKEY_APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.FIXKEY_APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.FIXKEY_APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.FIXKEY_APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.FIXKEY_APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.FIXKEY_APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          if [ "$RUNNER_OS" = macOS ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          node scripts/release/fixkey.mjs configure "$RUNNER_TEMP/fixkey-build.json" '${{ matrix.platform }}'
          pnpm --filter fixkey-desktop exec tauri build --features desktop --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config "$RUNNER_TEMP/fixkey-build.json"
      - name: Verify macOS signature and notarization receipt
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict 'target/aarch64-apple-darwin/release/bundle/macos/FixKey.app'
          xcrun stapler validate 'target/aarch64-apple-darwin/release/bundle/macos/FixKey.app'
      - name: Stage exact platform inventory
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          FIXKEY_PLATFORM: ${{ matrix.platform }}
          FIXKEY_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/fixkey.mjs stage "target/$FIXKEY_TARGET/release/bundle" "$RUNNER_TEMP/fixkey-assets" "$FIXKEY_PLATFORM" "$RELEASE_VERSION" "$RELEASE_REVISION"
      - name: Verify every updater signature with the embedded release key
        env:
          FIXKEY_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          for signature in "$RUNNER_TEMP/fixkey-assets/"*.sig; do
            cargo run --locked -p fixkey --example verify_update -- "${signature%.sig}" "$signature"
          done
      - name: Preserve source-bound candidate and updater signatures
        uses: actions/upload-artifact@v7
        with:
          name: fixkey-${{ matrix.platform }}
          path: ${{ runner.temp }}/fixkey-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    environment: fixkey-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      FIXKEY_UPDATER_PUBLIC_KEY: ${{ vars.FIXKEY_UPDATER_PUBLIC_KEY }}
      FIXKEY_NATIVE_ACCEPTANCE_REVISION: ${{ vars.FIXKEY_NATIVE_ACCEPTANCE_REVISION }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - name: Install locked signature verifier dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: fixkey-*
          merge-multiple: true
          path: ${{ runner.temp }}/fixkey-assets
      - name: Revalidate source, signatures and aggregate immutable metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$FIXKEY_NATIVE_ACCEPTANCE_REVISION" = "$RELEASE_REVISION"
          node scripts/release/fixkey.mjs source "$RELEASE_VERSION"
          rustup show active-toolchain
          for signature in "$RUNNER_TEMP/fixkey-assets/"*.sig; do
            cargo run --locked -p fixkey --example verify_update -- "${signature%.sig}" "$signature"
          done
          node scripts/release/fixkey.mjs metadata "$RUNNER_TEMP/fixkey-assets" "$RELEASE_VERSION" "$RELEASE_REVISION"
      - name: Publish only an exact immutable tag
        shell: bash
        run: |
          set -euo pipefail
          tag="fixkey@v$RELEASE_VERSION"
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_REVISION"
          # Existing releases, including interrupted drafts, require explicit
          # operator recovery. Never replace or overwrite published assets.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'fixkey-release-already-exists' >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/fixkey-release-notes.md"
          printf 'FixKey desktop packages. macOS is code signed and notarized. Windows executables are not Authenticode signed; Windows may show an unknown-publisher or SmartScreen warning. Updater payloads are signed on all platforms.\n\nSource revision: %s\n\nNative acceptance was reviewed for this exact revision through the protected release environments.\n\nReinstall a previous release package manually for recovery; local settings are preserved.\n' "$RELEASE_REVISION" > "$notes"
          gh release create "$tag" "$RUNNER_TEMP/fixkey-assets/"* --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_REVISION" --title "FixKey $RELEASE_VERSION" --notes-file "$notes" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
