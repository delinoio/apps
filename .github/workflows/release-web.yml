name: Publish selected web app
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      app:
        required: true
        type: string
      environment:
        required: true
        type: string
      pages_project_variable:
        required: true
        type: string
      concurrency_group:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ inputs.concurrency_group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars[inputs.pages_project_variable] }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the selected web application
        env:
          # Public browser identifiers only; Git Tracker is the only consumer.
          PUBLIC_LOGTO_ENDPOINT: ${{ vars.PUBLIC_LOGTO_ENDPOINT }}
          PUBLIC_LOGTO_APP_ID: ${{ vars.PUBLIC_LOGTO_APP_ID }}
        working-directory: apps/${{ inputs.app }}
        run: pnpm test
      - name: Include distribution notices
        run: cp "LICENSE" "NOTICE" "apps/${{ inputs.app }}/dist/"
      - name: Preserve the deployment candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-${{ inputs.revision }}
          path: apps/${{ inputs.app }}/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy the committed build to Cloudflare Pages production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        env:
          # pnpm 12 reads pnpm_config_* rather than npm_config_* settings.
          # The action installs Wrangler with `pnpm add` at the workspace root.
          # Remove this step-local exception when it supports `--workspace-root`.
          pnpm_config_ignore_workspace_root_check: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: pages deploy "apps/${{ inputs.app }}/dist" --project-name=${{ vars[inputs.pages_project_variable] }} --branch=main --commit-hash=${{ inputs.revision }}
      - name: Remove generated frontend output
        if: always()
        run: rm -rf "apps/${{ inputs.app }}/dist"
