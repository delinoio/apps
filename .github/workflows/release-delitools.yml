name: Release DeliTools Web
run-name: Release delitools (${{ github.event_name == 'push' && github.ref_name || inputs.tag }})

on:
  push:
    tags: ["delitools@v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable delitools@vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-delitools
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'delinoio/apps' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify the immutable tagged source belongs to main
        id: source
        env:
          RELEASE_PROJECT: delitools
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node "scripts/release/project.mjs" validate-web

  deploy:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: delitools-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test and build the selected web application
        working-directory: apps/delitools
        run: pnpm test
      - name: Include distribution notices
        run: cp "LICENSE" "NOTICE" "apps/delitools/dist/"
      - name: Preserve the deployment candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: delitools-${{ needs.source.outputs.version }}-${{ needs.source.outputs.revision }}
          path: apps/delitools/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy the tagged build to Cloudflare Pages production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: pages deploy "apps/delitools/dist" --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ needs.source.outputs.revision }}
      - name: Remove generated frontend output
        if: always()
        run: rm -rf "apps/delitools/dist"
