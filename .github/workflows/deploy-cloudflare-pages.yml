# Builds one static workspace package and uploads it to its Cloudflare Pages
# project. Called only by deploy.yml; see docs/repository-deployment-contract.md.
name: Deploy Cloudflare Pages
on:
  workflow_call:
    inputs:
      package:
        description: pnpm workspace package name
        required: true
        type: string
      pages-project:
        description: Cloudflare Pages project name
        required: true
        type: string
      output-directory:
        description: Build output directory relative to the repository root
        required: true
        type: string
      url:
        description: Production origin recorded on the GitHub deployment
        required: true
        type: string
permissions:
  contents: read
env:
  # Pinned Wrangler CLI used for Pages direct uploads.
  WRANGLER_VERSION: 4.153.0
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: static-sites
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate and build
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm exec turbo run typecheck test build --filter="$PACKAGE"
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
          PAGES_PROJECT: ${{ inputs.pages-project }}
        # --branch=main targets the production deployment of the Pages project.
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" pages deploy "$OUTPUT_DIRECTORY" --project-name="$PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
      - name: Record deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          PACKAGE: ${{ inputs.package }}
          PAGES_PROJECT: ${{ inputs.pages-project }}
          URL: ${{ inputs.url }}
        run: |
          echo "Revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: $PACKAGE; Pages project: $PAGES_PROJECT; origin: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: pnpm install --frozen-lockfile --ignore-scripts; pnpm exec turbo run typecheck test build --filter=$PACKAGE; wrangler@$WRANGLER_VERSION pages deploy --branch=main" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
