name: CI
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust_clippy: ${{ steps.rust-plan.outputs.rust_clippy }}
      rust_test: ${{ steps.rust-plan.outputs.rust_test }}
      rust_servers: ${{ steps.plan.outputs.rust_servers }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      delidev: ${{ steps.plan.outputs.delidev }}
      delitools: ${{ steps.plan.outputs.delitools }}
      lane: ${{ steps.plan.outputs.lane }}
      lane_cli: ${{ steps.plan.outputs.lane_cli }}
      devbase: ${{ steps.plan.outputs.devbase }}
      git_tracker: ${{ steps.plan.outputs.git_tracker }}
      delino_console: ${{ steps.plan.outputs.delino_console }}
      delino_site: ${{ steps.plan.outputs.delino_site }}
      delino_docs: ${{ steps.plan.outputs.delino_docs }}
      perfine_fixtures: ${{ steps.plan.outputs.perfine_fixtures }}
      protocol: ${{ steps.plan.outputs.protocol }}
      tooling: ${{ steps.plan.outputs.tooling }}
      shared_ui: ${{ steps.plan.outputs.shared_ui }}
      workflows: ${{ steps.plan.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - id: plan
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/plan.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-28
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-mono@0.6.9
      - id: rust-plan
        env:
          TURBO_SCM_BASE: ${{ steps.plan.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.plan.outputs.head }}
        run: node scripts/ci/rust-plan.mjs
  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-28
          components: rustfmt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: format
        run: pnpm format:check --all
      - id: rustfmt
        run: cargo fmt --all --check
      - id: server-rustfmt
        run: |
          cargo fmt --manifest-path servers/Cargo.toml --all --check
      - id: gofmt
        run: node scripts/ci/check-go-format.mjs protos examples tools/changeset
      - id: changesets
        run: |
          go vet ./tools/changeset
          go test -race ./tools/changeset
          pnpm changeset check
      - id: protobuf-format
        run: pnpm exec buf format --diff --exit-code
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: check-formatting
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-check-formatting-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delino-console/dist" "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/git-tracker/dist" "apps/lane/dist"
  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: tooling
        run: pnpm test:tooling
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: tooling
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-tooling-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delino-console/dist" "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/git-tracker/dist" "apps/lane/dist"
  shared-ui:
    needs: changes
    if: needs.changes.outputs.shared_ui == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: shared-ui
        run: pnpm --filter @packages/ui test
      - id: lynx-ui
        run: pnpm --filter @packages/lynx-ui test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: shared-ui
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-shared-ui-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delino-console/dist" "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/git-tracker/dist" "apps/lane/dist" "packages/lynx-ui/dist"
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: workflows
        run: go tool actionlint -shellcheck=''
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
