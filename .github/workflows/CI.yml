    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
      GOWORK: "off"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate protocol and consumer example
        id: unit-protocol
        run: |
          go vet ./protos/... ./examples/...
          go test -race ./protos/... ./examples/...
          go build -o "$RUNNER_TEMP/delcore-client" ./examples/delcore-client
          go build -o "$RUNNER_TEMP/git-tracker-client" ./examples/git-tracker-client
          go build -o "$RUNNER_TEMP/devbase-client" ./examples/devbase-client
          go build -o "$RUNNER_TEMP/delitools-client" ./examples/delitools-client
