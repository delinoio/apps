      - id: delidev-build
        if: contains(fromJSON(needs.changes.outputs.rust_test), 'delidev-desktop')
        run: pnpm --filter delidev-desktop build:frontend
      - id: delitools-build
        if: contains(fromJSON(needs.changes.outputs.rust_test), 'delitools-shell')
        run: pnpm --filter delitools build:frontend
      - id: fixkey-build
        if: contains(fromJSON(needs.changes.outputs.rust_test), 'fixkey')
        run: pnpm --filter fixkey-desktop build:frontend
      - id: test
        run: node scripts/ci/rust-check.mjs test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
