name: CI
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      delidev: ${{ steps.plan.outputs.delidev }}
      delitools: ${{ steps.plan.outputs.delitools }}
      devbase: ${{ steps.plan.outputs.devbase }}
      delino_site: ${{ steps.plan.outputs.delino_site }}
      protocol: ${{ steps.plan.outputs.protocol }}
      fixkey: ${{ steps.plan.outputs.fixkey }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - id: plan
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/plan.mjs
  validate:
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: format
        run: pnpm format:check
      - id: tooling
        run: pnpm test:tooling
      - id: workflows
        run: go tool actionlint -shellcheck=''
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: validate
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-validate-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  fixkey-frontend:
    needs: changes
    if: needs.changes.outputs.fixkey == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter fixkey-desktop ci:check
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: fixkey-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-fixkey-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  fixkey-desktop:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.fixkey == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy
      - id: native-prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - id: frontend
        shell: bash
        run: |
          pnpm --filter fixkey-desktop build:frontend
          cargo test --locked -p fixkey-core
          pnpm --filter fixkey-desktop ci:desktop
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: fixkey-desktop
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-fixkey-desktop-${{ matrix.os }}-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        shell: bash
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  delidev-frontend:
    needs: changes
    if: needs.changes.outputs.delidev == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delidev-desktop test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delidev-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delidev-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  delitools-frontend:
    needs: changes
    if: needs.changes.outputs.delitools == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delitools test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delitools-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delitools-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  devbase-frontend:
    needs: changes
    if: needs.changes.outputs.devbase == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter devbase test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: devbase-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-devbase-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  delino-site-frontend:
    needs: changes
    if: needs.changes.outputs.delino_site == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delino-site test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delino-site-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delino-site-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  rust-checks:
    needs: changes
    if: needs.changes.outputs.delidev == 'true' || needs.changes.outputs.delitools == 'true' || needs.changes.outputs.fixkey == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: rustfmt, clippy
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: native-prerequisites
        name: Install Linux native prerequisites
        run: |-
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libwebkit2gtk-4.1-dev libx11-dev libxtst-dev ninja-build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - id: delidev-build
        if: needs.changes.outputs.delidev == 'true'
        run: pnpm --filter delidev-desktop build:frontend
      - id: delitools-build
        if: needs.changes.outputs.delitools == 'true'
        run: pnpm --filter delitools build:frontend
      - id: rustfmt
        run: cargo fmt --all --check
      - id: test
        env:
          FIXKEY: ${{ needs.changes.outputs.fixkey }}
          DELIDEV: ${{ needs.changes.outputs.delidev }}
          DELITOOLS: ${{ needs.changes.outputs.delitools }}
        run: |-
          packages=()
          if [ "$FIXKEY" = true ]; then packages+=(-p fixkey-core); fi
          if [ "$DELIDEV" = true ]; then packages+=(-p delidev-desktop); fi
          if [ "$DELITOOLS" = true ]; then packages+=(-p delitools-shell); fi
          cargo test --locked "${packages[@]}" --all-targets
      - id: clippy
        env:
          FIXKEY: ${{ needs.changes.outputs.fixkey }}
          DELIDEV: ${{ needs.changes.outputs.delidev }}
          DELITOOLS: ${{ needs.changes.outputs.delitools }}
        run: |-
          packages=()
          if [ "$FIXKEY" = true ]; then packages+=(-p fixkey-core); fi
          if [ "$DELIDEV" = true ]; then packages+=(-p delidev-desktop); fi
          if [ "$DELITOOLS" = true ]; then packages+=(-p delitools-shell); fi
          cargo clippy --locked "${packages[@]}" --all-targets --all-features -- -D warnings
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: rust-checks
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-rust-checks-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/fixkey/dist"
  ci-result:
    if: ${{ always() }}
    needs:
      - changes
      - validate
      - delidev-frontend
      - fixkey-frontend
      - fixkey-desktop
      - delitools-frontend
      - devbase-frontend
      - delino-site-frontend
      - rust-checks
      - protocol
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |-
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const selection = needs.changes.outputs;
          const expected = { 'fixkey-frontend': selection.fixkey === 'true', 'fixkey-desktop': selection.fixkey === 'true' && process.env.EVENT_NAME === 'push', changes: true, validate: true, 'delino-site-frontend': selection.delino_site === 'true', 'devbase-frontend': selection.devbase === 'true', 'delidev-frontend': selection.delidev === 'true', 'delitools-frontend': selection.delitools === 'true', 'rust-checks': selection.delidev === 'true' || selection.delitools === 'true' || selection.fixkey === 'true', protocol: selection.protocol === 'true' };
          for (const [id, required] of Object.entries(expected)) {
            const result = needs[id]?.result;
            if (result !== (required ? 'success' : 'skipped')) throw new Error(id + ': ' + result);
          }
          NODE
  protocol:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
      GOWORK: "off"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate protocol and consumer example
        id: unit-protocol
        run: |
          node scripts/ci/check-go-format.mjs protos examples
          go vet ./...
          go test -race ./...
          go build -o "$RUNNER_TEMP/delcore-client" ./examples/delcore-client
          pnpm proto:lint
          pnpm proto:generate
          test -z "$(git status --porcelain --untracked-files=all -- protos)"
          node scripts/check-proto-breaking.mjs "$TURBO_SCM_BASE"
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: protocol
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-protocol-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
