      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: |
          pnpm --filter @apps/lane test
          pnpm --filter @apps/lane-chrome-extension test
          node --test apps/lane/native/desktop/realqa*.test.mjs
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: lane-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-lane-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/lane/dist" "apps/lane-chrome-extension/dist"
  lane-cli:
    needs: changes
    if: needs.changes.outputs.lane_cli == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
