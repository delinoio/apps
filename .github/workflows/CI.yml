name: CI
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust_clippy: ${{ steps.rust-plan.outputs.rust_clippy }}
      rust_test: ${{ steps.rust-plan.outputs.rust_test }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      delidev: ${{ steps.plan.outputs.delidev }}
      delitools: ${{ steps.plan.outputs.delitools }}
      devbase: ${{ steps.plan.outputs.devbase }}
      git_tracker: ${{ steps.plan.outputs.git_tracker }}
      delino_site: ${{ steps.plan.outputs.delino_site }}
      delino_docs: ${{ steps.plan.outputs.delino_docs }}
      delcore_api: ${{ steps.plan.outputs.delcore_api }}
      git_tracker_api: ${{ steps.plan.outputs.git_tracker_api }}
      protocol: ${{ steps.plan.outputs.protocol }}
      fixkey: ${{ steps.plan.outputs.fixkey }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - id: plan
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/plan.mjs
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-mono@0.6.9
      - id: rust-plan
        env:
          TURBO_SCM_BASE: ${{ steps.plan.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.plan.outputs.head }}
        run: node scripts/ci/rust-plan.mjs
  check-formatting:
    name: Check Formatting
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: dtolnay/rust-toolchain@v1
        if: needs.changes.outputs.rust_clippy != '[]'
        with:
          toolchain: nightly-2026-09-28
          components: rustfmt
      - uses: actions/setup-go@v6
        if: needs.changes.outputs.protocol == 'true' || needs.changes.outputs.delcore_api == 'true' || needs.changes.outputs.git_tracker_api == 'true'
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: format
        run: pnpm format:check
      - id: rustfmt
        if: needs.changes.outputs.rust_clippy != '[]'
        run: cargo fmt --all --check
      - id: gofmt
        if: needs.changes.outputs.protocol == 'true'
        run: node scripts/ci/check-go-format.mjs protos examples
      - id: server-gofmt
        if: needs.changes.outputs.delcore_api == 'true' || needs.changes.outputs.git_tracker_api == 'true'
        run: node scripts/ci/check-go-format.mjs servers
      - id: protobuf-format
        if: needs.changes.outputs.protocol == 'true'
        run: pnpm exec buf format --diff --exit-code
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: check-formatting
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-check-formatting-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  validate:
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: tooling
        run: pnpm test:tooling
      - id: shared-ui
        run: pnpm --filter @delino/ui test
      - id: workflows
        run: go tool actionlint -shellcheck=''
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: validate
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-validate-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  fixkey-frontend:
    needs: changes
    if: needs.changes.outputs.fixkey == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter fixkey-desktop ci:check
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: fixkey-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-fixkey-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  fixkey-desktop:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.fixkey == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy
      - id: native-prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - id: frontend
        shell: bash
        run: |
          pnpm --filter fixkey-desktop build:frontend
          cargo test --locked -p fixkey-core
          pnpm --filter fixkey-desktop ci:desktop
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: fixkey-desktop
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-fixkey-desktop-${{ matrix.os }}-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        shell: bash
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  delidev-frontend:
    needs: changes
    if: needs.changes.outputs.delidev == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delidev-desktop test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delidev-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delidev-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  delitools-frontend:
    needs: changes
    if: needs.changes.outputs.delitools == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
