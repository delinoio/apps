    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.rust_servers) }}
    env:
      SERVICE: ${{ matrix.service }}
      DATABASE_PORT: ${{ matrix.port }}
      POSTGRES_USER: ${{ matrix.user }}
