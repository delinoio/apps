name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base revision for affected validation
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Plan affected CI jobs
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.comparison.outputs.base }}
      head: ${{ steps.comparison.outputs.head }}
      quality: ${{ steps.plan.outputs.quality }}
      format: ${{ steps.plan.outputs.format }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
      go: ${{ steps.plan.outputs.go }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve affected comparison
        id: comparison
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)
              base="$PUSH_BASE"
              if [[ "$base" =~ ^0+$ ]]; then
                empty_tree="$(git hash-object -t tree /dev/null)"
                base="$(git -c user.name=CI -c user.email=ci@example.invalid commit-tree "$empty_tree" -m 'Empty comparison')"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$MANUAL_BASE" ]]; then
                base="$(git rev-parse --verify --end-of-options "${MANUAL_BASE}^{commit}")"
              else
                base="$(git merge-base origin/main "$head")"
              fi
              ;;
            *) exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Validation revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: $base..$head" >> "$GITHUB_STEP_SUMMARY"
      - name: Select affected validation
        id: plan
        env:
          CI_BASE: ${{ steps.comparison.outputs.base }}
          CI_HEAD: ${{ steps.comparison.outputs.head }}
        run: node scripts/ci/plan.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        if: needs.changes.outputs.format == 'true'
        env:
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: pnpm format:check
      - name: Test formatting and hooks
        if: needs.changes.outputs.fixtures == 'true'
        run: pnpm test
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          FORMAT_PLANNED: ${{ needs.changes.outputs.format }}
          FIXTURES_PLANNED: ${{ needs.changes.outputs.fixtures }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "Planned: format=$FORMAT_PLANNED; fixtures=$FIXTURES_PLANNED" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commands (when planned): pnpm install --frozen-lockfile --ignore-scripts; pnpm format:check; pnpm test' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime, account, native platform and release acceptance: not performed; CI does not build or deploy app projects yet.' >> "$GITHUB_STEP_SUMMARY"
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go module
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 --no-run-if-empty gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt reports unformatted files"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commands in the root Go module: gofmt -l on tracked .go files; go vet ./...; go test ./...' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime, deployment and release acceptance: not performed.' >> "$GITHUB_STEP_SUMMARY"
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm --filter delino-accounts exec e2e-web install chromium --with-deps
      - name: Run e2e suites
        id: run
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Pull requests from forks receive no secrets. Agent steps need the
          # model key, so those runs exclude tests tagged `agent`.
          if [[ -n "${AI_GATEWAY_API_KEY:-}" ]]; then
            echo "agent=included" >> "$GITHUB_OUTPUT"
            pnpm test:e2e -- --reporter list,junit
          else
            echo "agent=excluded" >> "$GITHUB_OUTPUT"
            echo "::notice::AI_GATEWAY_API_KEY is not available; tests tagged agent are excluded."
            pnpm test:e2e -- --reporter list,junit --exclude-tag agent
          fi
      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            apps/*/.e2e/report.json
            apps/*/.e2e/junit.xml
            apps/*/.e2e/results
            apps/*/.e2e/logs
          if-no-files-found: warn
          retention-days: 7
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          AGENT_TESTS: ${{ steps.run.outputs.agent }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; e2e-web install chromium --with-deps; pnpm test:e2e -- --reporter list,junit [--exclude-tag agent]' >> "$GITHUB_STEP_SUMMARY"
          echo "Agent-tagged tests: ${AGENT_TESTS:-not run}" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Scope: development servers in headless Chromium. Production build, Cloudflare Pages, account and release acceptance: not performed.' >> "$GITHUB_STEP_SUMMARY"
  ci-result:
    if: always()
    needs: [changes, quality, go, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        env:
          QUALITY_PLANNED: ${{ needs.changes.outputs.quality }}
          GO_PLANNED: ${{ needs.changes.outputs.go }}
          E2E_PLANNED: ${{ needs.changes.outputs.e2e }}
          NEEDS_RESULTS: ${{ toJSON(needs) }}
          VALIDATION_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Validation revision: $VALIDATION_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS_RESULTS" | jq -e --arg planned "$QUALITY_PLANNED" --arg go_planned "$GO_PLANNED" --arg e2e_planned "$E2E_PLANNED" 'all(.[]; .result == "success" or .result == "skipped") and .changes.result == "success" and (.quality.result == "success" or (.quality.result == "skipped" and $planned == "false")) and (.go.result == "success" or (.go.result == "skipped" and $go_planned == "false")) and (.e2e.result == "success" or (.e2e.result == "skipped" and $e2e_planned == "false"))' > /dev/null; then
            echo 'CI result: success' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'CI result: failure' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
