        with:
          toolchain: nightly-2026-09-28
      - name: Install protocol compiler
        id: protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
          if [ "$SERVICE" = lane-api ]; then sudo apt-get install -y python3-venv; fi
      - name: Validate Rust server with local protocol packages
        run: |
          cargo test --locked --manifest-path servers/Cargo.toml -p "$SERVICE"
        id: unit
      - name: Validate Lane monitoring rules and routes
        if: matrix.service == 'lane-api'
        id: monitoring
        run: servers/lane-api/ops/check.sh
      - name: Start integration database
        run: |
          # Interrupted jobs can leave this container on a persistent runner.
          docker rm --force "$SERVICE-postgres" >/dev/null 2>&1 || true
          docker run --detach --name "$SERVICE-postgres" -p "127.0.0.1:$DATABASE_PORT:5432" -e POSTGRES_USER -e "POSTGRES_PASSWORD=$POSTGRES_USER" -e POSTGRES_DB --health-cmd 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' --health-interval 2s --health-retries 30 postgres:17
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$SERVICE-postgres")" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs "$SERVICE-postgres"
          exit 1
        id: postgres
      - name: PostgreSQL integration tests
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: ${{ format('postgres://{0}:{0}@127.0.0.1:{1}/{2}?sslmode=disable', matrix.user, matrix.port, matrix.database) }}
