        id: unit-protocol
        run: |
          go vet ./protos/... ./examples/...
          go test -race ./protos/... ./examples/...
          go build -o "$RUNNER_TEMP/delcore-client" ./examples/delcore-client
          go build -o "$RUNNER_TEMP/git-tracker-client" ./examples/git-tracker-client
          pnpm exec buf lint
          pnpm proto:generate
          test -z "$(git status --porcelain --untracked-files=all -- protos)"
