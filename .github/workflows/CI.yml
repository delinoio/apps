          toolchain: nightly-2026-09-28
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: native-prerequisites
        name: Install Linux native prerequisites
        run: |-
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libwebkit2gtk-4.1-dev libx11-dev libxtst-dev ninja-build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
