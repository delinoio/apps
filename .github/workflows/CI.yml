      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delitools test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delitools-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delitools-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  git-tracker-clients:
    needs: changes
    if: needs.changes.outputs.git_tracker == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: |
          pnpm --filter git-tracker test
          pnpm --filter git-tracker-action ci:checks
          pnpm proto:generate
          test -z "$(git status --porcelain --untracked-files=all -- protos)"
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: git-tracker-clients
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-git-tracker-clients-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  devbase-frontend:
    needs: changes
    if: needs.changes.outputs.devbase == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter devbase test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: devbase-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-devbase-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  delino-site-frontend:
    needs: changes
    if: needs.changes.outputs.delino_site == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delino-site test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delino-site-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delino-site-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  delino-docs-frontend:
    needs: changes
    if: needs.changes.outputs.delino_docs == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: frontend
        run: pnpm --filter delino-docs test
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delino-docs-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-delino-docs-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/fixkey-app/dist" "apps/git-tracker/dist"
  rust-clippy:
    name: Rust Clippy
    needs: changes
    if: needs.changes.outputs.rust_clippy != '[]'
    runs-on: ubuntu-latest
    env:
      RUST_PACKAGES: ${{ needs.changes.outputs.rust_clippy }}
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-ci-node
        id: node
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          components: clippy
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: native-prerequisites
        name: Install Linux native prerequisites
        run: |-
          sudo apt-get update
          sudo apt-get install -y clang cmake libayatana-appindicator3-dev libgbm-dev libgtk-3-dev libgtk-4-dev xdg-desktop-portal xdg-desktop-portal-gtk zenity libwebkit2gtk-4.1-dev libx11-dev libxtst-dev ninja-build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - id: delidev-build
        if: contains(fromJSON(needs.changes.outputs.rust_clippy), 'delidev-desktop')
        run: pnpm --filter delidev-desktop build:frontend
      - id: delitools-build
        if: contains(fromJSON(needs.changes.outputs.rust_clippy), 'delitools-shell')
        run: pnpm --filter delitools build:frontend
      - id: fixkey-build
        if: contains(fromJSON(needs.changes.outputs.rust_clippy), 'fixkey')
        run: pnpm --filter fixkey-desktop build:frontend
      - id: clippy
        run: node scripts/ci/rust-check.mjs clippy
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.node.outputs.cache-path }}
          key: ${{ steps.node.outputs.cache-key }}
      - name: Record validation
