  ci-result:
    if: ${{ always() }}
    needs:
      - changes
      - validate
      - check-formatting
      - delidev-frontend
      - fixkey-frontend
      - fixkey-desktop
      - delitools-frontend
      - devbase-frontend
      - git-tracker-clients
      - delino-site-frontend
      - delino-docs-frontend
      - rust-clippy
      - rust-test
      - protocol
      - delcore-api
      - git-tracker-api
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |-
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const selection = needs.changes.outputs;
          const expected = { 'delcore-api': selection.delcore_api === 'true', 'git-tracker-api': selection.git_tracker_api === 'true', 'git-tracker-clients': selection.git_tracker === 'true', 'fixkey-frontend': selection.fixkey === 'true', 'fixkey-desktop': selection.fixkey === 'true' && process.env.EVENT_NAME === 'push', changes: true, validate: true, 'check-formatting': true, 'delino-site-frontend': selection.delino_site === 'true', 'delino-docs-frontend': selection.delino_docs === 'true', 'devbase-frontend': selection.devbase === 'true', 'delidev-frontend': selection.delidev === 'true', 'delitools-frontend': selection.delitools === 'true', 'rust-clippy': selection.rust_clippy !== '[]', 'rust-test': selection.rust_test !== '[]', protocol: selection.protocol === 'true' };
          for (const [id, required] of Object.entries(expected)) {
            const result = needs[id]?.result;
            if (result !== (required ? 'success' : 'skipped')) throw new Error(id + ': ' + result);
          }
          NODE
  protocol:
    needs: changes
