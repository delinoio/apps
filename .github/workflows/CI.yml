      - name: Record validation
        if: ${{ always() }}
        env:
          VALIDATION_JOB: delitools-frontend
          VALIDATION_RESULT: ${{ job.status }}
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/record-validation.mjs
      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-delitools-frontend-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove generated output
        if: ${{ always() }}
        run: rm -rf "apps/delino-console/dist" "apps/delidev/dist" "apps/delitools/dist" "apps/devbase/dist" "apps/delino-site/dist" "apps/delino-docs/dist" "apps/git-tracker/dist" "apps/lane/dist"
  lane-frontend:
    needs: changes
    if: needs.changes.outputs.lane == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
