        with:
          toolchain: nightly-2026-09-28
      - name: Install protocol compiler
        id: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: cli
        run: |
          cargo test --locked -p lane
          pnpm --filter @delinoio/lane test
          pnpm --filter @delinoio/lane build --platform linux-amd64
          pnpm --filter @delinoio/lane smoke
      - name: Save pnpm cache after successful main validation
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
