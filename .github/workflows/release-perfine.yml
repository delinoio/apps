name: Release Perfine
run-name: Prepare Perfine ${{ inputs.tag }} (publish=${{ inputs.publish }})
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact vX.Y.Z; existing perfine@vX.Y.Z source tag must belong to main
        required: true
        type: string
      publish:
        description: Publish the reviewed artifacts to npm, GitHub Releases and the existing Action repository
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-perfine
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'delinoio/apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: source
        env:
          PERFINE_RELEASE_TAG: ${{ inputs.tag }}
        run: node "packages/perfine/scripts/release.mjs" source
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: perfine
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: perfine
          - target: aarch64-apple-darwin
            runner: macos-15
            executable: perfine
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: perfine.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PERFINE_TARGET: ${{ matrix.target }}
      PERFINE_BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Preserve identical package source bytes on every host
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-28
          targets: ${{ matrix.target }}
      - name: Install and verify protocol compiler prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          protoc --version
          test -r "/usr/include/google/protobuf/descriptor.proto"
          test -r "/usr/include/google/protobuf/empty.proto"
          test -r "/usr/include/google/protobuf/timestamp.proto"
      - name: Install macOS protocol compiler prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version
          PROTOBUF_INCLUDE="$(brew --prefix protobuf)/include"
          for name in descriptor empty timestamp; do
            test -r "$PROTOBUF_INCLUDE/google/protobuf/$name.proto"
          done
          echo "PROTOC_INCLUDE=$PROTOBUF_INCLUDE" >> "$GITHUB_ENV"
      - name: Install Windows protocol compiler prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Cannot install protoc" }
          $compiler = Get-ChildItem "$env:ChocolateyInstall/lib/protoc" -Recurse -Filter protoc.exe | Select-Object -First 1
          $descriptor = Get-ChildItem "$env:ChocolateyInstall/lib/protoc" -Recurse -Filter descriptor.proto | Select-Object -First 1
          if (!$compiler -or !$descriptor) { throw "protoc or well-known includes missing" }
          $include = Split-Path (Split-Path $descriptor.DirectoryName -Parent) -Parent
          foreach ($name in @("descriptor", "empty", "timestamp")) {
            if (!(Test-Path "$include/google/protobuf/$name.proto")) { throw "Missing $name.proto" }
          }
          "PROTOC=$($compiler.FullName)" >> $env:GITHUB_ENV
          "PROTOC_INCLUDE=$include" >> $env:GITHUB_ENV
          & $compiler.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "protoc is not executable" }
      - run: cargo build --locked --release -p perfine --target "$PERFINE_TARGET"
      - name: Verify native host paths, private state and child cancellation
        run: |
          cargo test --locked -p perfine-core --lib --target "$PERFINE_TARGET" adapters::host
          cargo test --locked -p perfine-core --lib --target "$PERFINE_TARGET" adapters::process::portable_tests
      - name: Linux Action and packaging regression checks
        if: runner.os == 'Linux'
        run: |
          pnpm --dir "actions/perfine" test
          pnpm --dir "actions/perfine" build
          git diff --exit-code -- "actions/perfine/ACTION_NOTICES"
          pnpm --dir "packages/perfine" test
      - name: Package and execute the actual native release archives
        run: |
          node "packages/perfine/scripts/build.mjs"
          node "packages/perfine/scripts/smoke.mjs"
          node "packages/perfine/scripts/release-set.mjs" record-host "packages/perfine/dist/release"
      - name: Preserve reviewable release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perfine-${{ matrix.target }}
          path: packages/perfine/dist/release/
          if-no-files-found: error
          retention-days: 7
      - name: Record scope of verification
        env:
          SOURCE_REVISION: ${{ needs.source.outputs.revision }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "Source: $SOURCE_REVISION"
            echo "Target: $TARGET; actual npm and standalone installation/executable smoke passed."
            cat "packages/perfine/dist/release/validation.json"
            echo 'Minimum-OS evidence is separate: Windows Server is not Windows 11 validation. Docker, native profiler, live registry, provider, OIDC and account acceptance remain unperformed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf "packages/perfine/dist" "actions/perfine/dist"
  prepare-set:
    needs: [source, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: perfine-*
          path: packages/perfine/dist/targets
      - name: Require all target archives and matching native smoke evidence
        env:
          PERFINE_SOURCE_COMMIT: ${{ needs.source.outputs.revision }}
          PERFINE_RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            mv "packages/perfine/dist/targets/perfine-$target" "packages/perfine/dist/targets/$target"
          done
          node "packages/perfine/scripts/release-set.mjs" assemble "packages/perfine/dist/targets" "packages/perfine/dist/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perfine-release-${{ needs.source.outputs.revision }}
          path: packages/perfine/dist/release/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: rm -rf "packages/perfine/dist"
  publish:
    if: inputs.publish
    needs: [source, build, prepare-set]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: perfine-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: perfine-release-${{ needs.source.outputs.revision }}
          path: packages/perfine/dist/release/
      - name: Verify complete release set and namespace authority before any publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PERFINE_NPM_TOKEN }}
        run: |
          node "packages/perfine/scripts/release-set.mjs" verify "packages/perfine/dist/release"
          node "packages/perfine/scripts/release-set.mjs" preflight "packages/perfine/dist/release"
      - name: Publish immutable Action tag and verify its commit
        id: action
        env:
          GH_TOKEN: ${{ secrets.PERFINE_DISTRIBUTION_TOKEN }}
          PERFINE_APPROVE_RELEASE: "true"
          PERFINE_RELEASE_TAG: ${{ inputs.tag }}
          PERFINE_SOURCE_COMMIT: ${{ needs.source.outputs.revision }}
          PERFINE_RELEASE_DIRECTORY: packages/perfine/dist/release
        run: |
          gh auth setup-git
          chmod +x "packages/perfine/dist/release/action/runtime/perfine"
          node "packages/perfine/scripts/release.mjs" publish-action
      - name: Publish exact platform packages, then the entry package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PERFINE_NPM_TOKEN }}
          PERFINE_APPROVE_RELEASE: "true"
        run: node "packages/perfine/scripts/release-set.mjs" publish-npm "packages/perfine/dist/release"
      - name: Publish standalone release and verified Action record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "perfine@$RELEASE_TAG" --repo delinoio/apps --verify-tag --title "Perfine $RELEASE_TAG" --notes-file "packages/perfine/dist/release/action-release.json" "packages/perfine/dist/release/"*.tar.gz "packages/perfine/dist/release/"*.tgz "packages/perfine/dist/release/SHA256SUMS" "packages/perfine/dist/release/release-set.json" "packages/perfine/dist/release/action-release.json"
      - name: Record verified Action SHA
        env:
          ACTION_COMMIT: ${{ steps.action.outputs.action-commit }}
        run: echo "Verified distribution commit for generated workflows $ACTION_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf "packages/perfine/dist" "actions/perfine/dist"
