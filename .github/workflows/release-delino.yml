name: Release Delino
run-name: Release delino (${{ github.event_name == 'push' && github.ref_name || inputs.tag }})

on:
  push:
    tags: ["delino@v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable delino@vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-delino
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'delinoio/apps' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify the immutable tagged source belongs to main
        id: source
        env:
          RELEASE_PROJECT: delino
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node "scripts/release/project.mjs" validate-web

  images:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        server: [delcore-api, devbase-api, git-tracker-api]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and publish the immutable server image
        env:
          SERVER: ${{ matrix.server }}
          VERSION: ${{ needs.source.outputs.version }}
          REVISION: ${{ needs.source.outputs.revision }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/${SERVER}:${VERSION}"
          # A release tag never moves, so a retry reuses the published image.
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Reusing the published image for this release"
          else
            docker build \
              --file "servers/${SERVER}/Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${REVISION}" \
              --label "org.opencontainers.image.licenses=FSL-1.1-ALv2" \
              --tag "$image" .
            docker push "$image"
          fi
          printf 'Image: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: delino-site
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_SITE
          - app: delino-docs
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_DOCS
          - app: devbase
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_DEVBASE
          - app: git-tracker
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_GIT_TRACKER
    environment: delino-site-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.revision }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-node
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars[matrix.pages_project_variable] }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the selected web application
        env:
          # Public browser identifiers only; Git Tracker is the only consumer.
          PUBLIC_LOGTO_ENDPOINT: ${{ vars.PUBLIC_LOGTO_ENDPOINT }}
          PUBLIC_LOGTO_APP_ID: ${{ vars.PUBLIC_LOGTO_APP_ID }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm build
      - name: Include distribution notices
        run: cp "LICENSE" "NOTICE" "apps/${{ matrix.app }}/dist/"
      - name: Preserve the deployment candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ needs.source.outputs.version }}-${{ needs.source.outputs.revision }}
          path: apps/${{ matrix.app }}/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy the tagged build to Cloudflare Pages production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        env:
          # pnpm 12 reads pnpm_config_* rather than npm_config_* settings.
          # The action installs Wrangler with `pnpm add` at the workspace root.
          # Remove this step-local exception when it supports `--workspace-root`.
          pnpm_config_ignore_workspace_root_check: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: pages deploy "apps/${{ matrix.app }}/dist" --project-name=${{ vars[matrix.pages_project_variable] }} --branch=main --commit-hash=${{ needs.source.outputs.revision }}
      - name: Remove generated frontend output
        if: always()
        run: rm -rf "apps/${{ matrix.app }}/dist"
