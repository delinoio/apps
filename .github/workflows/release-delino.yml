name: Release Delino
run-name: Release delino (${{ inputs.tag }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable delino@vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-delino
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'delinoio/apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify the immutable tagged source belongs to main
        id: source
        env:
          RELEASE_PROJECT: delino
          RELEASE_TAG: ${{ inputs.tag }}
        run: node "scripts/release/project.mjs" validate-web

  binaries:
    needs: source
    permissions:
      contents: write
    uses: ./.github/workflows/release-lane.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      tag: ${{ inputs.tag }}

  core:
    needs: source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-server.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      server: delcore-api
      image_tag: ${{ needs.source.outputs.version }}

  images:
    needs: [source, core]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        server: [delitools-api, devbase-api, git-tracker-api, lane-api]
    uses: ./.github/workflows/release-server.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      server: ${{ matrix.server }}
      image_tag: ${{ needs.source.outputs.version }}

  deploy:
    needs: [source, images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: delino-site
            environment: delino-site-production
            concurrency_group: release-delino-site
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_SITE
          - app: delino-docs
            environment: delino-site-production
            concurrency_group: release-delino-docs
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_DOCS
          # DevBase keeps its owning environment and the concurrency group of
          # release-devbase.yml, so both workflows share one reviewer gate and
          # never upload to the same Pages project at the same time.
          - app: devbase
            environment: devbase-production
            concurrency_group: release-devbase
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT
          - app: git-tracker
            environment: delino-site-production
            concurrency_group: release-git-tracker
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_GIT_TRACKER
          - app: lane
            environment: delino-site-production
            concurrency_group: release-lane
            pages_project_variable: CLOUDFLARE_PAGES_PROJECT_LANE
    uses: ./.github/workflows/release-web.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      app: ${{ matrix.app }}
      environment: ${{ matrix.environment }}
      pages_project_variable: ${{ matrix.pages_project_variable }}
      concurrency_group: ${{ matrix.concurrency_group }}
    secrets: inherit
