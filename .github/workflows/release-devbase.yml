name: Release DevBase
run-name: Release devbase (${{ inputs.tag }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable devbase@vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-devbase
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'delinoio/apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify the immutable tagged source belongs to main
        id: source
        env:
          RELEASE_PROJECT: devbase
          RELEASE_TAG: ${{ inputs.tag }}
        run: node "scripts/release/project.mjs" validate-web

  deploy:
    needs: source
    uses: ./.github/workflows/release-web.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      app: devbase
      environment: devbase-production
      pages_project_variable: CLOUDFLARE_PAGES_PROJECT
      concurrency_group: release-devbase
    secrets: inherit
