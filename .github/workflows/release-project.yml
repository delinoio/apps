name: Release Project
run-name: Release ${{ inputs.project }} (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to version and tag
        required: true
        type: choice
        options: [devbase, delino-site, delitools, fixkey]
      bump:
        description: Stable SemVer increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release-project
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'delinoio/apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_PROJECT: ${{ inputs.project }}
      RELEASE_BUMP: ${{ inputs.bump }}
    steps:
      - name: Create release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DELINO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DELINO_RELEASE_BOT_PRIVATE_KEY }}
          owner: delinoio
          repositories: apps
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          # The bot token lets tag pushes trigger the owning release workflow.
          # Checkout removes its persisted credential in the post-job cleanup.
          token: ${{ steps.bot.outputs.token }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve release bot commit identity
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          login="${BOT_SLUG}[bot]"
          id=$(gh api "users/$login" --jq .id)
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
      - name: Commit and atomically push the selected version and tag
        id: source
        run: node "scripts/release/project.mjs" prepare
      - name: Record the distribution handoff
        env:
          VERSION: ${{ steps.source.outputs.version }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const project = process.env.RELEASE_PROJECT;
          const lines = project === 'fixkey'
            ? [`Run Release FixKey manually on main with version ${process.env.VERSION} after reviewing native acceptance for ${process.env.REVISION}. The dispatch source must match the immutable tag.`]
            : project === 'delitools'
              ? ['The tag starts Release DeliTools Web. For mobile, run Release DeliTools Mobile on main with a new build number; store uploads remain opt-in.']
              : ['The tag starts the owning web release workflow. Inspect that run for the deployment result.'];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n' + lines.join('\n') + '\n');
          JS
