# SPDX-License-Identifier: Apache-2.0
name: Lane
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.delino.lane
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: YES
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../store"
    LANE_STORE_OUTPUT: "$(DERIVED_FILE_DIR)/lane-store-libs"
    LANE_API_URL: ""
    LANE_OAUTH_CLIENT_ID: ""
    LANE_APNS_ENVIRONMENT: development
  configs:
    Debug:
      LANE_URL_SCHEME: lane-dev
    Release:
      LANE_URL_SCHEME: lane
      LANE_APNS_ENVIRONMENT: production
targets:
  Lane:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../../dist/main.lynx.bundle
        buildPhase: resources
      - path: ../../dist/LICENSE
        buildPhase: resources
      - path: ../../dist/NOTICE
        buildPhase: resources
      - path: ../licenses
        buildPhase: resources
    dependencies:
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: Security.framework
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: io.delino.lane
            CFBundleURLSchemes: ["$(LANE_URL_SCHEME)"]
        LaneURLScheme: "$(LANE_URL_SCHEME)"
        LaneAPIURL: "$(LANE_API_URL)"
        LaneOAuthClientID: "$(LANE_OAUTH_CLIENT_ID)"
        BGTaskSchedulerPermittedIdentifiers: [io.delino.lane.refresh]
        UIBackgroundModes: [fetch, remote-notification]
    entitlements:
      path: Generated/Lane.entitlements
      properties:
        aps-environment: "$(LANE_APNS_ENVIRONMENT)"
    preBuildScripts:
      - name: Build shared Lane store
        script: sh "${SRCROOT}/Scripts/build-store.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(LANE_STORE_OUTPUT)/liblane_store.a"
          - "$(LANE_STORE_OUTPUT)/liblane_sqlite.a"
          - "$(LANE_STORE_OUTPUT)/liblane_unicode.a"
          - "$(LANE_STORE_OUTPUT)/liblane_url.a"
        INFOPLIST_KEY_CFBundleDisplayName: Lane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    postBuildScripts:
      - name: Include dependency notices
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cp "${PODS_ROOT}/Target Support Files/Pods-Lane/Pods-Lane-acknowledgements.plist" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ThirdPartyNotices.plist"
          sh "${SRCROOT}/Scripts/copy-store-notices.sh"
          if [ -d "${SRCROOT}/../../dist/licenses" ]; then
            mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BundleLicenses"
            cp -R "${SRCROOT}/../../dist/licenses/." "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BundleLicenses/"
          fi
        inputFiles:
          - "$(PODS_ROOT)/Target Support Files/Pods-Lane/Pods-Lane-acknowledgements.plist"
          - "$(SRCROOT)/../store/vendor/sqlite/LICENSE"
          - "$(SRCROOT)/../store/vendor/ada/LICENSE-APACHE"
          - "$(SRCROOT)/../store/vendor/ada/LICENSE-MIT"
          - "$(SRCROOT)/../store/vendor/json/LICENSE.MIT"
          - "$(SRCROOT)/../store/vendor/picosha2/LICENSE"
          - "$(SRCROOT)/../store/vendor/utf8proc/LICENSE.md"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ThirdPartyNotices.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/StoreLicenses/sqlite/LICENSE"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/StoreLicenses/ada/LICENSE-APACHE"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/StoreLicenses/ada/LICENSE-MIT"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/StoreLicenses/json/LICENSE.MIT"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/StoreLicenses/picosha2/LICENSE"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/StoreLicenses/utf8proc/LICENSE.md"
