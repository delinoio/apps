# Disposable local development dependencies. Never use these credentials in production.
services:
  delcore-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: delcore
      POSTGRES_PASSWORD: local-delcore
      POSTGRES_DB: delcore
    ports:
      - "127.0.0.1:${DELCORE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - delcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U delcore -d delcore"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  delitools-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: delitools
      POSTGRES_PASSWORD: local-delitools
      POSTGRES_DB: delitools
