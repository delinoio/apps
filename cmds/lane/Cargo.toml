[package]
name = "lane"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
hex = "0.4"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
caseless = "0.2"
url = "2"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Com", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
