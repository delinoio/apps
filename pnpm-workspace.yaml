packages:
  - apps/*
  - actions/*
  - packages/*
  - examples/devbase-client-ts
  - servers/*
  - protos

# These versions were already locked before the pnpm 12 migration. Remove
# these exceptions after both releases are 24 hours old (2026-10-20 06:00 UTC).
minimumReleaseAgeExclude:
  - "@rsbuild/core@2.2.14"
  - "@rstest/core@0.12.4"

allowBuilds:
  "@bufbuild/buf": true
  esbuild: true
  lefthook: true
  # Wrangler needs workerd installation during tagged Pages deployment.
  workerd: true

overrides:
  ajv@>=7.0.0-alpha.0 <8.18.0: ">=8.18.0"
  minimatch@<10.2.1: ">=10.2.1"
  "@stoplight/spectral-core>minimatch": "3.1.5"
  "axios": "1.16.0"
  "basic-ftp": "5.3.1"
  "brace-expansion@>=1.0.0 <1.1.16": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.2": "5.0.12"
  "brace-expansion@>=5.0.0 <5.0.8": "5.0.12"
  "engine.io>cookie": "0.7.2"
  "esbuild": "0.28.2"
  "express": "4.22.3"
  "fast-uri": "3.1.8"
  "follow-redirects": "1.16.1"
  "form-data": "4.0.6"
  "http-proxy-agent>@tootallnate/once": "3.0.1"
  "ip-address": "10.7.4"
  "js-yaml": "4.3.2"
  "lodash": "4.18.1"
  "path-to-regexp": "0.1.13"
  "postcss": "8.5.30"
  "qs": "6.16.1"
  "react-router-dom": "7.18.4"
  "shell-quote": "1.9.0"
  "uuid": "11.1.1"
  "ws@>=6.0.0 <6.2.4": "6.2.6"
  "ws@>=7.0.0 <7.5.11": "7.5.13"
  "ws@>=8.0.0 <8.21.0": "8.21.3"
