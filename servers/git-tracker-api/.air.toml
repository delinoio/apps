# Resolve the repository root from the service workspace to watch shared Go files.
root = "../.."
tmp_dir = "tmp/git-tracker-api"
env_files = ["servers/git-tracker-api/.env"]

[build]
cmd = 'go build -o "../../tmp/git-tracker-api/server" "./cmd/git-tracker-api"'
entrypoint = ["./tmp/git-tracker-api/server"]
include_dir = ["servers/git-tracker-api", "protos"]
include_file = ["go.mod", "go.sum"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "node_modules", ".git"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "5s"

[build.windows]
cmd = 'go build -o "../../tmp/git-tracker-api/server.exe" "./cmd/git-tracker-api"'
entrypoint = ["tmp\\git-tracker-api\\server.exe"]

[log]
time = true

[misc]
clean_on_exit = true
