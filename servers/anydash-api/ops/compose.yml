# Monitoring only. Join an existing private network containing anydash-api:46331.
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      [
        "--config.file=/etc/anydash-monitoring/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
      ]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - .:/etc/anydash-monitoring:ro
      - prometheus-data:/prometheus
    secrets: [anydash_metrics_token]
    networks: [anydash]
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      [
        "--config.file=/etc/alertmanager/alertmanager.yml",
        "--storage.path=/alertmanager",
        "--data.retention=120h",
      ]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ${ANYDASH_ALERTMANAGER_CONFIG:?Set an operator-prepared absolute config path}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [anydash_smtp_password]
    networks: [anydash]
secrets:
  anydash_metrics_token:
    file: ${ANYDASH_METRICS_TOKEN_FILE:?Set an absolute secret file path}
  anydash_smtp_password:
    file: ${ANYDASH_SMTP_PASSWORD_FILE:?Set an absolute secret file path}
networks:
  anydash:
    external: true
    name: ${ANYDASH_MONITORING_NETWORK:?Set an existing private network name}
volumes:
  prometheus-data:
  alertmanager-data:
