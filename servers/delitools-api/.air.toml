# Resolve the repository root from the service workspace to watch shared Go files.
root = "../.."
tmp_dir = "tmp/delitools-api"

[build]
args_bin = ["-config", "config.local.json"]
cmd = 'go build -o "../../tmp/delitools-api/server" "./cmd/delitools-api"'
entrypoint = ["./tmp/delitools-api/server"]
include_dir = ["servers/delitools-api", "protos"]
include_file = ["go.mod", "go.sum"]
include_ext = ["go", "sql", "json"]
exclude_dir = ["tmp", "node_modules", ".git"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "5s"

[build.windows]
cmd = 'go build -o "../../tmp/delitools-api/server.exe" "./cmd/delitools-api"'
entrypoint = ["tmp\\delitools-api\\server.exe"]

[log]
time = true

[misc]
clean_on_exit = true
