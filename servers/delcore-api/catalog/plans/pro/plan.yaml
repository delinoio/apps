# SPDX-License-Identifier: FSL-1.1-ALv2
# Paid plan with a fixed fee, a usage price with shared included usage, a
# per-group metered limit, and one value of each configuration type.
kind: plan
key: example-pro
name: Example Pro
rank: 10
free: false
postpaid: false
features:
  - service: example-api
    key: api-access
    enabled: true
  - service: example-api
    key: monthly-requests
    limit: "100000"
  - service: example-api
    key: monthly-tokens
    limit: "5000000"
  - service: example-api
    key: export-enabled
    configuration: true
  - service: example-api
    key: max-projects
    configuration: 25
  - service: example-api
    key: storage-gb
    configuration: "50.5"
  - service: example-api
    key: support-tier
    configuration: priority
  - service: example-api
    key: allowed-regions
    configuration: ["us", "eu"]
