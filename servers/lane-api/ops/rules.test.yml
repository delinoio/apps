rule_files: [alerts.yml]
evaluation_interval: 30s
group_eval_order: [lane-alerts]
tests:
  - name: health fires after five minutes and recovers after five healthy minutes
    interval: 30s
    input_series:
      - series: probe_success{job="lane-health",instance="api",component="service"}
        values: "0+0x11 1+0x30"
      - series: up{job="lane-health",instance="api",component="service"}
        values: "1+0x50"
    alert_rule_test:
      - eval_time: 4m30s
        alertname: LaneHealthFailure
        exp_alerts: []
      - eval_time: 5m
        alertname: LaneHealthFailure
        exp_alerts:
          - exp_labels:
              {
                job: lane-health,
                instance: api,
                component: service,
                severity: critical,
              }
      - eval_time: 10m30s
        alertname: LaneHealthFailure
        exp_alerts:
          - exp_labels:
              {
                job: lane-health,
                instance: api,
                component: service,
                severity: critical,
              }
      - eval_time: 11m
        alertname: LaneHealthFailure
        exp_alerts: []
  - name: push queue age strictly exceeds threshold and empty queue recovers in ten minutes
    interval: 30s
    input_series:
      - series: lane_push_oldest_pending_age_seconds
        values: "600 601+0x10 0+0x30"
      - series: lane_push_pending_count
        values: "1+0x11 0+0x30"
    alert_rule_test:
      - eval_time: 0m
        alertname: LanePushQueueAge
        exp_alerts: []
      - eval_time: 30s
        alertname: LanePushQueueAge
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 15m30s
        alertname: LanePushQueueAge
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 16m
        alertname: LanePushQueueAge
        exp_alerts: []
  - name: LaneApiErrors minimum samples, threshold, hold and recovery interruption
    interval: 30s
    input_series:
      - series: lane:api_errors:ratio5m
        values: "0.05x10 0.060000000000000005x32 0x70"
      - series: lane:api_samples:5m
        values: "19x21 20x21 0x10 20x10 0x2 20x50"
    alert_rule_test:
      - eval_time: 5m
        alertname: LaneApiErrors
        exp_alerts: []
      - eval_time: 15m30s
        alertname: LaneApiErrors
        exp_alerts: []
      - eval_time: 16m
        alertname: LaneApiErrors
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 25m
        alertname: LaneApiErrors
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 31m30s
        alertname: LaneApiErrors
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 40m
        alertname: LaneApiErrors
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 44m30s
        alertname: LaneApiErrors
        exp_alerts: []
  - name: LaneApiLatency minimum samples, threshold, hold and recovery interruption
    interval: 30s
    input_series:
      - series: lane:api_latency:p95_5m
        values: "2x10 2.01x32 0x70"
      - series: lane:api_samples:5m
        values: "19x21 20x21 0x10 20x10 0x2 20x50"
    alert_rule_test:
      - eval_time: 5m
        alertname: LaneApiLatency
        exp_alerts: []
      - eval_time: 15m30s
        alertname: LaneApiLatency
        exp_alerts: []
      - eval_time: 16m
        alertname: LaneApiLatency
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 25m
        alertname: LaneApiLatency
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 31m30s
        alertname: LaneApiLatency
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 40m
        alertname: LaneApiLatency
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 44m30s
        alertname: LaneApiLatency
        exp_alerts: []
  - name: LanePushFailures minimum samples, threshold, hold and recovery interruption
    interval: 30s
    input_series:
      - series: lane:push_transient:ratio15m
        values: "0.1x10 0.11x32 0x70"
      - series: lane:push_samples:15m
        values: "19x21 20x21 0x10 20x10 0x2 20x50"
    alert_rule_test:
      - eval_time: 5m
        alertname: LanePushFailures
        exp_alerts: []
      - eval_time: 15m30s
        alertname: LanePushFailures
        exp_alerts: []
      - eval_time: 16m
        alertname: LanePushFailures
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 25m
        alertname: LanePushFailures
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 31m30s
        alertname: LanePushFailures
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 40m
        alertname: LanePushFailures
        exp_alerts: [{ exp_labels: { severity: warning } }]
      - eval_time: 44m30s
        alertname: LanePushFailures
        exp_alerts: []
  - name: exact rate and latency boundaries do not fire with sufficient samples
    interval: 30s
    input_series:
      - series: lane:api_samples:5m{service="lane"}
        values: "20x60"
      - series: lane:api_errors:ratio5m{service="lane"}
        values: "0.05x60"
      - series: lane:api_latency:p95_5m{service="lane"}
        values: "2x60"
      - series: lane:push_samples:15m{service="lane"}
        values: "20x60"
      - series: lane:push_transient:ratio15m{service="lane"}
        values: "0.10x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: LaneApiErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: LaneApiLatency
        exp_alerts: []
      - eval_time: 20m
        alertname: LanePushFailures
        exp_alerts: []
  - name: queue age and emptiness retain service isolation across replica turnover
    interval: 30s
    input_series:
      - series: lane_push_oldest_pending_age_seconds{service="lane",instance="old"}
        values: "700x10 stale"
      - series: lane_push_oldest_pending_age_seconds{service="lane",instance="healthy"}
        values: "700x60"
      - series: lane_push_pending_count{service="lane",instance="healthy"}
        values: "1x60"
      - series: lane_push_pending_count{service="other",instance="healthy"}
        values: "0x60"
      - series: lane_push_oldest_pending_age_seconds{service="other",instance="healthy"}
        values: "0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: LanePushQueueAge
        exp_alerts: [{ exp_labels: { service: lane, severity: warning } }]
  - name: missing rate samples cannot recover an existing alert
    interval: 30s
    input_series:
      - series: lane:api_samples:5m{service="lane"}
        values: "20x12 stale"
      - series: lane:api_errors:ratio5m{service="lane"}
        values: "0.06x12 stale"
    alert_rule_test:
      - eval_time: 25m
        alertname: LaneApiErrors
        exp_alerts: [{ exp_labels: { service: lane, severity: warning } }]
