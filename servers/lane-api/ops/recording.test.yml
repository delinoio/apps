rule_files: [recording.yml]
evaluation_interval: 30s
fuzzy_compare: true
tests:
  - interval: 30s
    input_series:
      - series: lane_api_requests_total{outcome="success"}
        values: "0+18x40"
      - series: lane_api_requests_total{outcome="server_error"}
        values: "0+1x40"
      - series: lane_api_requests_total{outcome="timeout"}
        values: "0+1x40"
      - series: lane_push_attempts_total{result="success"}
        values: "0+8x40"
      - series: lane_push_attempts_total{result="transient_failure"}
        values: "0+2x40"
      - series: lane_api_request_duration_seconds_bucket{le="1"}
        values: "0+19x40"
      - series: lane_api_request_duration_seconds_bucket{le="+Inf"}
        values: "0+20x40"
    promql_expr_test:
      - expr: lane:api_samples:5m
        eval_time: 15m
        exp_samples: [{ labels: "lane:api_samples:5m", value: 200 }]
      - expr: lane:api_errors:ratio5m
        eval_time: 15m
        exp_samples: [{ labels: "lane:api_errors:ratio5m", value: 0.1 }]
      - expr: lane:push_samples:15m
        eval_time: 15m
        exp_samples: [{ labels: "lane:push_samples:15m", value: 300 }]
      - expr: lane:push_transient:ratio15m
        eval_time: 15m
        exp_samples: [{ labels: "lane:push_transient:ratio15m", value: 0.2 }]
      - expr: lane:api_latency:p95_5m
        eval_time: 15m
        exp_samples: [{ labels: "lane:api_latency:p95_5m", value: 1 }]
  - name: global push counters deduplicate replicas, keep services isolated, and survive turnover
    interval: 30s
    input_series:
      - series: lane_push_attempts_total{service="lane",instance="old",result="success"}
        values: "0+10x20 stale"
      - series: lane_push_attempts_total{service="lane",instance="healthy",result="success"}
        values: "0+10x60"
      - series: lane_push_attempts_total{service="lane",instance="new",result="success"}
        values: "_x20 210+10x39"
      - series: lane_push_attempts_total{service="lane",instance="healthy",result="transient_failure"}
        values: "0+0x60"
      - series: lane_push_attempts_total{service="lane",instance="healthy",result="permanent_failure"}
        values: "0+0x60"
      - series: lane_push_attempts_total{service="other",instance="healthy",result="success"}
        values: "0+20x60"
      - series: lane_push_attempts_total{service="other",instance="healthy",result="transient_failure"}
        values: "0+20x60"
    promql_expr_test:
      - expr: lane:push_samples:15m
        eval_time: 20m
        exp_samples:
          - labels: 'lane:push_samples:15m{service="lane"}'
            value: 300
          - labels: 'lane:push_samples:15m{service="other"}'
            value: 1200
      - expr: lane:push_transient:ratio15m
        eval_time: 20m
        exp_samples:
          - labels: 'lane:push_transient:ratio15m{service="lane"}'
            value: 0
          - labels: 'lane:push_transient:ratio15m{service="other"}'
            value: 0.5
