[package]
name = "lane-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
buffa.workspace = true
buffa-types.workspace = true
chrono.workspace = true
connectrpc.workspace = true
hex.workspace = true
httpdate.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["http2"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
server-common.workspace = true
delino-protocol.workspace = true
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
aes-gcm = "0.10"
url = "2"
serde_jcs = "0.2"
web-push = { version = "0.11", default-features = false }
futures-core = "0.3"
async-stream = "0.3"

unicode-casefold = "0.2"
png = "0.18"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
# Validates the advertised MCP tool input schemas against canonical fixtures.
jsonschema = { version = "0.60", default-features = false }
