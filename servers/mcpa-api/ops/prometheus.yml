# Example configuration. Mount this directory at /etc/mcpa-monitoring and change
# the private targets for your deployment. Keep /metrics off public routes.
global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
rule_files:
  - /etc/mcpa-monitoring/thresholds.yml
  - /etc/mcpa-monitoring/recording.yml
  - /etc/mcpa-monitoring/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: mcpa-api
    metrics_path: /metrics
    # MCPA_METRICS_TOKEN, mounted from the monitoring secret store.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/mcpa_metrics_token
    static_configs:
      - targets: ["mcpa-api:46329"]
