[package]
name = "perfine-core"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Shared evidence validation and durable experiment engine for Perfine"
repository = "https://github.com/delinoio/apps"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
fs2 = "0.4"
flate2 = "1"
prost = "0.14"
tempfile = "3"



# Local engine metadata is independent of the server workspace.
[lints]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
